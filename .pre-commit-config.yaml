# ForgeMind pre-commit hooks
# ============================
# 安装: pip install pre-commit && pre-commit install
# 运行: pre-commit run --all-files
# 跳过: git commit --no-verify
#
# 参考: OpenBB (https://github.com/OpenBB-finance/OpenBB) +
#       Freqtrade (https://github.com/freqtrade/freqtrade)
#
repos:
  # 1. 凭证泄露检测 — 最关键，优先运行
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # 首次运行后生成 .secrets.baseline
        # 后续 commit 只检测新增的 secrets

  # 2. Ruff — linter + formatter (black + isort + pyflakes 合体)
  #    规则集: F|E|W (lint) + I (import排序) + UP (pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # 3. 拼写检查
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--ignore-words", ".codespellignore"]
        # tests/ 目录大量缩写变量名，跳过
        exclude: "^tests/"

  # 4. pre-commit-hooks 基础工具集
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 文件末尾必须是单个换行符
      - id: end-of-file-fixer
      # 去除行尾多余空格
      - id: trailing-whitespace
        args: ["--markdown-linechar-extensions"]
      # YAML 文件格式校验
      - id: check-yaml
      # TOML 文件格式校验
      - id: check-toml
      # 不允许 merge conflict 标记进入 commit
      - id: check-merge-conflict
        args: ["--assume-in-whole"]
