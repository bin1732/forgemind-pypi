# ruff 规则集 —— 与私人仓 pyproject 里的保持一致
#
# 显式列出规则,是为了让本地与流水线跑的是同一套:不写的话,ruff 一升级
# 默认规则就变了,同一份代码本地干净、流水线却报出一批新问题。
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT"]
ignore = [
    "E501",  # 行太长(为了可读性接受长行)
    "B008",  # 参数默认值里调用函数(pydantic 的写法)
    "N803",  # 参数名用大写(机器学习里 X/y 是矩阵)
    "N806",  # 变量名用大写
    "B905",  # zip 不带 strict
]
