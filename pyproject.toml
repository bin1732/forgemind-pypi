[build-system]
requires = ["setuptools>=68", "setuptools-pkg>=0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind"
version = "2026.09.0"
description = "ForgeMind - AI Quant Trading Agent"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

# Core runtime dependencies
dependencies = [
    # Web / API
    "fastapi>=0.115.5,<999",
    "uvicorn[standard]>=0.32.1,<999",
    "pydantic>=2.10.3,<999",
    "pydantic-settings>=2.6.1,<999",
    "python-multipart>=0.0.20,<999",

    # DB / Data
    "polars>=1.17.1,<999",
    "duckdb>=1.1.3,<999",
    "clickhouse-driver>=0.2.9,<999",
    "asyncpg>=0.30.0,<999",
    "sqlalchemy>=2.0.36,<999",
    "alembic>=1.14.0,<999",

    # Cache / Queue
    "redis>=5.2.1,<999",
    "nats-py>=2.0.0",

    # Workflow
    "prefect>=3.0.3,<999",

    # Quant
    "pandas>=2.2.3,<999",
    "numpy>=1.26.4,<999",

    # ML
    "lightgbm>=4.5.0,<999",
    "xgboost>=2.1.3,<999",
    "scikit-learn>=1.6.0,<999",
    "scipy>=1.10,<2",
    # torch is OPTIONAL via [ml] extra (see below)
    "pyarrow>=15.0,<999",  # required by polars DataFrame.to_pandas()

    # AI Agent
    "langgraph>=0.2.55,<999",
    "langchain-core>=0.3.21,<999",
    "langchain-openai>=0.2.5,<999",
    "langchain-anthropic>=0.3,<1",
    "openai>=1.59.7,<999",
    "anthropic>=0.3,<1",

    # RAG
    "llama-index>=0.12.18,<999",
    "chromadb>=0.5.23,<999",

    # Market data
    "yfinance>=0.2.51,<999",
    "ccxt>=4.4.66,<999",

    # Performance attribution
    "quantstats>=0.0.62,<999",
    "empyrical-reloaded>=0.5.9,<999",

    # Utilities
    "httpx>=0.28.1,<999",
    "tenacity>=9.0.0,<999",
    "structlog>=24.4.0,<999",
    "python-jose[cryptography]>=3.3.0,<999",
    "passlib[bcrypt]>=1.7.4,<999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<999",
    "pytest-asyncio>=0.24.0,<999",
    "pytest-cov>=6.0.0,<999",
    "ruff>=0.8.3,<999",
    "mypy>=1.13.0,<999",
    "black>=24.10.0,<999",
]
ml = [
    "torch>=2.0,<3",  # only for transformer_model; CPU users: --extra-index-url https://download.pytorch.org/whl/cpu
]

[project.scripts]
forgemind = "forgemind.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forgemind", "forgemind.*"]
exclude = ["tests*", "scripts*", "docker*", "configs*", "migrations*", "forgemind_ui*"]
# Explicitly exclude non-Python frontend
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests (requires docker)",
    "broker: marks tests requiring broker credentials",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT"]
ignore = [
    "E501",  # line too long (we accept longer lines for readability)
    "B008",  # do not perform function calls in argument defaults (pydantic pattern)
    "N803",  # argument name should be lowercase (ML convention uses X/y matrices)
    "N806",  # variable in function should be lowercase (ML convention)
    "B905",  # zip without explicit strict (Python 3.10+ default; OK for older compat)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
