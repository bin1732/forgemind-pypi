[package]
name = "forgemind-desktop"
version = "2026.9.0"
description = "ForgeMind Desktop — GitHub 头部级量化 Agent 框架"
authors = ["灵感引擎工坊 (bin1732)"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "forgemind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true