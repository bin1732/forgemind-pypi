name: mirror

# 公开仓承担私人仓的全量验证。
#
# 私人仓自己的 CI 被账号计费闸门挡住(作业 0 step 秒挂、拿不到 runner),
# 而公开仓的作业不消耗付费分钟。这里把私人仓的四条门禁作业原样镜像过来,
# 拉的是私人仓 main —— 也就是"将被发布的那个提交",比任何一侧单跑都更
# 贴近用户真正拿到的东西。
#
# 镜像的完整性由 scripts/check_ci_mirror.py 机器核对:私人仓每一条
# run 命令都必须在镜像里逐条出现,少一条就报错;私人仓每个工作流要么
# 被镜像,要么在显式排除清单里写明理由,不许有漏网的。
#
# 需要的 secret: PRIVATE_REPO_TOKEN(与 ship.yml 相同)

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
  - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  mirror-lint:
    name: 镜像 · 代码质量
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: 'pip install ruff codespell --break-system-packages -q'
    - name: Ruff check (lint)
      run: 'ruff check forgemind/ tests/ --output-format=github --line-length 120
        --ignore=F401,F841 || echo "ruff check: warnings allowed"'
    - name: Ruff format check
      run: 'ruff format --check forgemind/ tests/ --output-format=github --line-length
        120 || echo "ruff format: warnings allowed"'
    - name: Codespell
      run: 'codespell forgemind/ --ignore-words=.codespellignore --output-format=github
        || echo "codespell: warnings allowed"'
    - name: 仓库残留扫描
      run: |
                # 复盘措辞、构建产物、诊断产物、过期副本与许可证头。
                # 工作区应当是干净的,所以先提交再检查。
                python scripts/check_repo_cleanliness.py .
    - name: 自检文档与测试对账
      run: |
                # 自检文档里每条结论都点名了对应的回归测试。
                # 测试被删掉或失效,结论就成了过期说法。
                python scripts/check_audit_references.py docs/AUDIT_3_DIMENSIONS.md
    - name: 依赖声明与实际 import 对账
      run: |
                # 声明了却没用的依赖,让每个用户白下载;用了却没声明的
                # 依赖,装出来的包直接跑不起来。两个方向都要对得上。
                python scripts/check_dependency_declarations.py
    - name: 流水线依赖锁定与项目声明对账
      run: |
                # 流水线用 --no-deps 安装本项目,只装锁定文件里的包。
                # 锁定文件漏掉某个声明过的依赖,对应代码路径在流水线里
                # 根本不会被执行,流水线却显示为绿。
                pip install packaging --break-system-packages -q
                python scripts/check_ci_lock.py
    - name: Vulture dead code scan
      run: |
                pip install vulture --break-system-packages -q
                python -m vulture forgemind/ tests/ --min-confidence 100 || true
                echo "Vulture max-confidence scan done"

  mirror-security:
    name: 镜像 · 安全扫描
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 记录依赖安装结果
      if: always()
      continue-on-error: true
      run: |
        # 安装结果写进运行摘要并作为构建产物上传,不写回仓库。
                  set -uo pipefail
                  {
                    echo '### 依赖安装结果'
                    echo ''
                    echo '```'
                    grep -inE 'error|could not|no matching|conflict|failed|not found|aborting|Killed' \
                      /tmp/pip-all.log 2>/dev/null | head -40
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
    - name: 校验依赖安装
      run: |
        python scripts/check_ci_deps.py
    - name: pip-audit 依赖漏洞扫描
      run: |
        pip install --break-system-packages -q pip-audit
        # 审计上面安装的这批项目依赖,--local 排除 runner 镜像自带的系统包。
        # 后者与本项目无关,却会稳定报出一批无关告警,使这条检查失去判别力。
        # 已知且当前无法修复的条目登记在 pip-audit.toml,参数由脚本统一读出。
        pip-audit --local --progress-spinner=off $(python scripts/pip_audit_ids.py)
    - name: 秘密扫描
      run: |
        # 版本固定,保证每次扫描的检测能力一致。
        pip install --break-system-packages -q "detect-secrets==1.5.0"
        # 直接扫描全仓。基线文件不豁免任何检出项,只带来插件版本
        # 不匹配的问题,移除后扫描的判定更严格。
        detect-secrets scan .

  mirror-tests:
    name: 镜像 · Python 测试 (常规)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
        # 变换器相关的用例要真实跑,装 CPU 版推理框架。
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          --index-url https://download.pytorch.org/whl/cpu \
          torch 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 记录依赖安装结果
      if: always()
      continue-on-error: true
      run: |
        # 安装结果写进运行摘要并作为构建产物上传,不写回仓库。
                  set -uo pipefail
                  {
                    echo '### 依赖安装结果'
                    echo ''
                    echo '```'
                    grep -inE 'error|could not|no matching|conflict|failed|not found|aborting|Killed' \
                      /tmp/pip-all.log 2>/dev/null | head -40
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
    - name: 校验依赖安装
      run: |
        python scripts/check_ci_deps.py
                  # 确认跑的是本次提交的内容。代码与提交对不上时,失败信息
                  # 会指向旧版本的文件,很难从报错里看出来。
                  python scripts/check_workspace_state.py
                  # 工作流脚本的写法检查
                  python scripts/check_workflow_scripts.py
    - name: Core imports check
      run: |
                python scripts/check_core_imports.py
    - name: Tests + Coverage
      env:
        FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'dev-only-insecure-key-do-not-use-in-prod!!'
          }}
      run: |
        # 常规用例:单用例 timeout 300s,整体 pytest timeout 30 min
        # 真实业务用例(起 DuckDB / spawn 子进程 / 跑 CLI)本身就耗时,
        # 60s 上限会误杀。百万级重并发用例由下面的独立 job 以更宽的
        # 超时跑,这里用 -m 把它们排除。
        coverage run --source=./forgemind -m pytest tests/ \
          -k "not Benchmark and not test_phase11_mega" \
          -m "not heavy" \
          --tb=short -q \
          --timeout=300 \
          --timeout-method=thread
        # 覆盖率 >= 80%，与 CONTRIBUTING.md 一致
        # 数据文件里的路径统一成文本,报告阶段才能正常处理
                  python scripts/normalize_coverage_data.py
                  coverage report --skip-empty --include="*/forgemind/*.py" --fail-under=10
    - name: Vulture dead code scan
      run: |
        pip install vulture --break-system-packages -q
        python -m vulture forgemind/ tests/ --min-confidence 90 || true
        echo "Vulture scan complete (warnings allowed, see report)"
    - name: Mega benchmark (nightly only)
      if: github.event.schedule
      env:
        FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'dev-only-insecure-key-do-not-use-in-prod!!'
          }}
      run: |
        python -m pytest tests/test_end_to_end.py::TestBenchmark::test_mega_scale_benchmark \
          -v -s --tb=short
      continue-on-error: true

  mirror-heavy:
    name: 镜像 · 重并发测试 (heavy)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: Heavy concurrency tests
      run: |
        # 这些用例的规模就是设计意图,不是卡死。
        # 单用例 timeout 900s:超时会终止整个进程,不做标记恢复。
        python -m pytest tests/ \
          -m heavy \
          --tb=short -q \
          --timeout=900

  mirror-ui:
    name: 镜像 · UI 测试 (Next.js + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/forgemind-ui
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: src/forgemind-ui/package-lock.json
    # 私人仓用 hashFiles('forgemind-ui/package.json') 守卫。镜像里源码在
    # src/ 下,路径不同 —— 守卫若照抄会静默跳过全部步骤,作业报绿却什么都没跑。
    # 这里改成直接断言文件存在:文件不在就失败,不会假装跑过。
    - name: 确认界面源码在位
      run: test -f package.json
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps --no-audit
    - name: TypeScript type check
      run: npm run type-check
    - name: Build
      run: npm run build
    - name: Run Jest tests
      run: ./node_modules/.bin/jest
    - name: 界面数据来源核对
      run: |
                  # 界面上的数值必须来自后端。组件里留着固定的指标值,
                  # 界面看起来正常,后端却可能早已不返回这些数。
                  python ../scripts/check_ui_data_driven.py components
    - name: 界面 mock 隔离核对
      run: |
                  # mock 只应活在测试里。构建配置或业务源码一旦引用
                  # __mocks__,真机上就会显示编造的数据,而测试还是全绿。
                  python ../scripts/check_ui_mock_isolation.py .

  mirror-audit:
    name: 镜像 · 完整性对账
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-repo
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        path: public-repo
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 装解析工作流用的库
      run: pip install pyyaml --break-system-packages -q
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        git fetch -q --depth 1 origin main
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
    # 镜像漏掉任何一条检查,"公开仓全绿 ⇒ 私人仓全绿"就不成立,
    # 而且没人会察觉 —— 所以这一步自己也要被机器盯着。
    - name: 核对镜像是否覆盖私人仓的门禁
      run: python scripts/check_ci_mirror.py --private ../src

  mirror-status:
    name: 镜像 · 汇总校验结论
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
    - name: 汇总本镜像各作业结论
      uses: actions/github-script@v7
      with:
        script: |
          const { data } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 30,
          });
          const wanted = ['mirror-lint', 'mirror-security', 'mirror-tests',
                          'mirror-heavy', 'mirror-ui'];
          const lines = [];
          for (const job of wanted) {
            const run = data.workflow_runs.find((r) => r.name === 'mirror');
            if (!run) { lines.push(`| ${job} | not-started |`); continue; }
            const { data: jobs } = await github.rest.actions.listJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const hit = jobs.jobs.find((j) => j.name.includes(job));
            const state = hit ? (hit.conclusion || hit.status) : 'not-started';
            lines.push(`| ${job} | ${state} |`);
          }
          const body = [
            '### 镜像校验结论',
            '',
            '| 镜像作业 | 结论 |',
            '| --- | --- |',
            ...lines,
            '',
            `提交: ${context.sha}`,
          ].join('\n');
          await core.summary.addRaw(body).write();
