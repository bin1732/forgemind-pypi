name: mirror

# 公开仓承担私人仓的全量验证。
#
# 私人仓自己的 CI 被账号计费闸门挡住(作业 0 step 秒挂、拿不到 runner),
# 而公开仓的作业不消耗付费分钟。这里把私人仓的四条门禁作业原样镜像过来,
# 拉的是私人仓 main —— 也就是"将被发布的那个提交",比任何一侧单跑都更
# 贴近用户真正拿到的东西。
#
# 镜像的完整性由 scripts/check_ci_mirror.py 机器核对:私人仓每一条
# run 命令都必须在镜像里逐条出现,少一条就报错;私人仓每个工作流要么
# 被镜像,要么在显式排除清单里写明理由,不许有漏网的。
#
# 需要的 secret: PRIVATE_REPO_TOKEN(与 ship.yml 相同)

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
  - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  # 构件的来源提交写在公开仓的清单里。镜像测的必须是它 —— 否则"测过的"
  # 与"发出去的"可能不是同一份代码,全绿也就没有意义了。
  resolve-source:
    name: 镜像 · 定位构件来源提交
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        path: public-repo
        ref: main
    - name: 从清单读出来源提交
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        sha=$(python3 -c "import json;print(json.load(open('public-repo/releases/builds/manifest.json')).get('source_commit',''))")
        if [ -z "$sha" ]; then
          echo "清单里没有 source_commit —— 构件没记来源提交,测的就无法与发布的对上" >&2
          exit 1
        fi
        echo "构件来源提交: $sha"
        echo "commit=$sha" >> "$GITHUB_OUTPUT"

  mirror-lint:
    name: 镜像 · 代码质量
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: 'pip install ruff codespell --break-system-packages -q'
    - name: Ruff check (lint)
      run: 'ruff check forgemind/ tests/ --output-format=github --line-length 120
        --ignore=F401,F841 || echo "ruff check: warnings allowed"'
    - name: Ruff format check
      run: 'ruff format --check forgemind/ tests/ --output-format=github --line-length
        120 || echo "ruff format: warnings allowed"'
    - name: Codespell
      run: 'codespell forgemind/ --ignore-words=.codespellignore --output-format=github
        || echo "codespell: warnings allowed"'
    - name: 仓库残留扫描
      run: |
                # 复盘措辞、构建产物、诊断产物、过期副本与许可证头。
                # 工作区应当是干净的,所以先提交再检查。
                python scripts/check_repo_cleanliness.py .
    - name: 自检文档与测试对账
      run: |
                # 自检文档里每条结论都点名了对应的回归测试。
                # 测试被删掉或失效,结论就成了过期说法。
                python scripts/check_audit_references.py docs/AUDIT_3_DIMENSIONS.md
    - name: 依赖声明与实际 import 对账
      run: |
                # 声明了却没用的依赖,让每个用户白下载;用了却没声明的
                # 依赖,装出来的包直接跑不起来。两个方向都要对得上。
                python scripts/check_dependency_declarations.py
    - name: 流水线依赖锁定与项目声明对账
      run: |
                # 流水线用 --no-deps 安装本项目,只装锁定文件里的包。
                # 锁定文件漏掉某个声明过的依赖,对应代码路径在流水线里
                # 根本不会被执行,流水线却显示为绿。
                pip install packaging --break-system-packages -q
                python scripts/check_ci_lock.py
    - name: Vulture dead code scan
      run: |
                pip install vulture --break-system-packages -q
                python -m vulture forgemind/ tests/ --min-confidence 100 || true
                echo "Vulture max-confidence scan done"

  mirror-security:
    name: 镜像 · 安全扫描
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 记录依赖安装结果
      if: always()
      continue-on-error: true
      run: |
        # 安装结果写进运行摘要并作为构建产物上传,不写回仓库。
                  set -uo pipefail
                  {
                    echo '### 依赖安装结果'
                    echo ''
                    echo '```'
                    grep -inE 'error|could not|no matching|conflict|failed|not found|aborting|Killed' \
                      /tmp/pip-all.log 2>/dev/null | head -40
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
    - name: 校验依赖安装
      run: |
        python scripts/check_ci_deps.py
    - name: pip-audit 依赖漏洞扫描
      run: |
        pip install --break-system-packages -q pip-audit
        # 审计上面安装的这批项目依赖,--local 排除 runner 镜像自带的系统包。
        # 后者与本项目无关,却会稳定报出一批无关告警,使这条检查失去判别力。
        # 已知且当前无法修复的条目登记在 pip-audit.toml,参数由脚本统一读出。
        pip-audit --local --progress-spinner=off $(python scripts/pip_audit_ids.py)
    - name: 秘密扫描
      run: |
        # 版本固定,保证每次扫描的检测能力一致。
        pip install --break-system-packages -q "detect-secrets==1.5.0"
        # 直接扫描全仓。基线文件不豁免任何检出项,只带来插件版本
        # 不匹配的问题,移除后扫描的判定更严格。
        detect-secrets scan .

  mirror-tests:
    name: 镜像 · Python 测试 (常规)
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
        # 变换器相关的用例要真实跑,装 CPU 版推理框架。
        pip install --break-system-packages --no-cache-dir --prefer-binary \
          --index-url https://download.pytorch.org/whl/cpu \
          torch 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 记录依赖安装结果
      if: always()
      continue-on-error: true
      run: |
        # 安装结果写进运行摘要并作为构建产物上传,不写回仓库。
                  set -uo pipefail
                  {
                    echo '### 依赖安装结果'
                    echo ''
                    echo '```'
                    grep -inE 'error|could not|no matching|conflict|failed|not found|aborting|Killed' \
                      /tmp/pip-all.log 2>/dev/null | head -40
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
    - name: 校验依赖安装
      run: |
        python scripts/check_ci_deps.py
                  # 确认跑的是本次提交的内容。代码与提交对不上时,失败信息
                  # 会指向旧版本的文件,很难从报错里看出来。
                  python scripts/check_workspace_state.py
                  # 工作流脚本的写法检查
                  python scripts/check_workflow_scripts.py
                  # 自检文档里声明的数字。用例数要真跑 pytest 采集才知道
                  # (参数化会让函数数量失真),所以这一步只能放在依赖齐全
                  # 的作业里,不能放在只装了静态检查工具的作业里。
                  python scripts/check_audit_claims.py docs/AUDIT_3_DIMENSIONS.md
    - name: Core imports check
      run: |
                python scripts/check_core_imports.py
    - name: Tests + Coverage
      env:
        FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'dev-only-insecure-key-do-not-use-in-prod!!'
          }}
      run: |
        # 常规用例:单用例 timeout 300s,整体 pytest timeout 30 min
        # 真实业务用例(起 DuckDB / spawn 子进程 / 跑 CLI)本身就耗时,
        # 60s 上限会误杀。百万级重并发用例由下面的独立 job 以更宽的
        # 超时跑,这里用 -m 把它们排除。
        coverage run --source=./forgemind -m pytest tests/ \
          -k "not Benchmark and not test_phase11_mega" \
          -m "not heavy" \
          --tb=short -q \
          --timeout=300 \
          --timeout-method=thread
        # 覆盖率 >= 80%，与 CONTRIBUTING.md 一致
        # 数据文件里的路径统一成文本,报告阶段才能正常处理
                  python scripts/normalize_coverage_data.py
                  coverage report --skip-empty --include="*/forgemind/*.py" --fail-under=10
    - name: Vulture dead code scan
      run: |
        pip install vulture --break-system-packages -q
        python -m vulture forgemind/ tests/ --min-confidence 90 || true
        echo "Vulture scan complete (warnings allowed, see report)"
    - name: Mega benchmark (nightly only)
      if: github.event.schedule
      env:
        FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'dev-only-insecure-key-do-not-use-in-prod!!'
          }}
      run: |
        python -m pytest tests/test_end_to_end.py::TestBenchmark::test_mega_scale_benchmark \
          -v -s --tb=short
      continue-on-error: true

  mirror-heavy:
    name: 镜像 · 重并发测试 (heavy)
    needs: resolve-source
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: Heavy concurrency tests
      run: |
        # 这些用例的规模就是设计意图,不是卡死。
        # 单用例 timeout 900s:超时会终止整个进程,不做标记恢复。
        python -m pytest tests/ \
          -m heavy \
          --tb=short -q \
          --timeout=900

  mirror-ui:
    name: 镜像 · UI 测试 (Next.js + Jest)
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/forgemind-ui
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: src/forgemind-ui/package-lock.json
    # 私人仓用 hashFiles('forgemind-ui/package.json') 守卫。镜像里源码在
    # src/ 下,路径不同 —— 守卫若照抄会静默跳过全部步骤,作业报绿却什么都没跑。
    # 这里改成直接断言文件存在:文件不在就失败,不会假装跑过。
    - name: 确认界面源码在位
      run: test -f package.json
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps --no-audit
    - name: TypeScript type check
      run: npm run type-check
    - name: Build
      run: npm run build
    - name: Run Jest tests
      run: ./node_modules/.bin/jest
    - name: 界面数据来源核对
      run: |
                  # 界面上的数值必须来自后端。组件里留着固定的指标值,
                  # 界面看起来正常,后端却可能早已不返回这些数。
                  python ../scripts/check_ui_data_driven.py components
    - name: 界面 mock 隔离核对
      run: |
                  # mock 只应活在测试里。构建配置或业务源码一旦引用
                  # __mocks__,真机上就会显示编造的数据,而测试还是全绿。
                  python ../scripts/check_ui_mock_isolation.py .

  mirror-audit:
    name: 镜像 · 完整性对账
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-repo
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        path: public-repo
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 装解析工作流用的库
      run: pip install pyyaml --break-system-packages -q
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 深度 200 够私人仓的 git 历史用例:最近一个 audit 命名的提交在
        # 173 个提交之前,再往前的老提交用例会自己跳过。
        git fetch -q --depth 200 origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        if ! git log --oneline --grep=audit -1 | grep -qi audit; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    # 镜像漏掉任何一条检查,"公开仓全绿 ⇒ 私人仓全绿"就不成立,
    # 而且没人会察觉 —— 所以这一步自己也要被机器盯着。
    - name: 核对镜像是否覆盖私人仓的门禁
      run: python scripts/check_ci_mirror.py --private ../src
    - name: 核对测的就是发的那个提交
      shell: bash
      run: |
        set -euo pipefail
        want=$(python3 -c "import json;print(json.load(open('releases/builds/manifest.json')).get('source_commit',''))")
        got=$(git -C ../src rev-parse HEAD)
        if [ -z "$want" ]; then
          echo "清单里没有 source_commit,无法核对来源" >&2
          exit 1
        fi
        if [ "$want" != "$got" ]; then
          echo "测的提交与构件来源不一致: 测的是 $got,构件是 $want" >&2
          exit 1
        fi
        {
          echo "### 构件来源"
          echo ""
          echo "| 项 | 值 |"
          echo "| --- | --- |"
          echo "| 构件来源提交 | \`$got\` |"
          echo "| 本次镜像实测提交 | \`$got\` |"
          echo "| 私人仓门禁 | 镜像 4 条工作流,逐条命令核对 |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "测的就是发的那个提交: $got"

  mirror-status:
    name: 镜像 · 汇总校验结论
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
    - name: 汇总本镜像各作业结论
      uses: actions/github-script@v7
      with:
        script: |
          // workflow_run 触发时 context.run 是 undefined(事件载荷里没有
          // run 对象),当前 run 的 id 只能从环境变量拿。
          // Octokit 里没有 listJobs,按 run 列作业要走
          // listJobsForWorkflowRun,它同时要 workflow_id —— 从
          // GITHUB_WORKFLOW_REF 里取文件名的后半段,文件改名也不会失效。
          const runId = Number(process.env.GITHUB_RUN_ID);
          const ref = process.env.GITHUB_WORKFLOW_REF || '';
          const workflowId = (ref.split('/.github/workflows/')[1] || '').split('@')[0]
            || 'ci-mirror.yml';
          let lines;
          try {
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              run_id: runId,
            });
            lines = data.jobs.map(
              (j) => `| ${j.name} | ${j.conclusion || j.status} |`);
          } catch (err) {
            // 这个作业只是把结论写进运行摘要,取不到就把原因写进去,
            // 不该让整个作业标红 —— 它本来就不参与门禁。
            lines = [`| 取作业结论失败 | ${err.message} |`];
          }
          const body = [
            '### 镜像校验结论',
            '',
            '| 镜像作业 | 结论 |',
            '| --- | --- |',
            ...lines,
            '',
            `提交: ${context.sha}`,
          ].join('\n');
          await core.summary.addRaw(body).write();
