name: mirror

# 公开仓承担私人仓的全量验证。
#
# 私人仓自己的 CI 被账号计费闸门挡住(作业 0 step 秒挂、拿不到 runner),
# 而公开仓的作业不消耗付费分钟。这里把私人仓的四条门禁作业原样镜像过来,
# 拉的是私人仓 main —— 也就是"将被发布的那个提交",比任何一侧单跑都更
# 贴近用户真正拿到的东西。
#
# 镜像的完整性由 scripts/check_ci_mirror.py 机器核对:私人仓每一条
# run 命令都必须在镜像里逐条出现,少一条就报错;私人仓每个工作流要么
# 被镜像,要么在显式排除清单里写明理由,不许有漏网的。
#
# 需要的 secret: PRIVATE_REPO_TOKEN(与 ship.yml 相同)

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:
  schedule:
  - cron: '17 3 * * *'

permissions:
  contents: read

# 新的发布会把还在跑的验证顶掉。被顶掉的那次记成 cancelled
# (而不是 failure)—— 它验的是已经被取代的构件,红在那里只会误导人。
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 构件的来源提交写在公开仓的清单里。镜像测的必须是它 —— 否则"测过的"
  # 与"发出去的"可能不是同一份代码,全绿也就没有意义了。
  resolve-source:
    name: 镜像 · 定位构件来源提交
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        ref: main
    - name: 从清单读出来源提交
      id: source
      uses: ./.github/actions/resolve-source

  mirror-lint:
    name: 镜像 · 代码质量
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 取完整历史。私人仓的 git 历史用例会回看很早以前的提交(最早那个
        # audit 命名的提交在两百多个提交之前)。用固定深度取源码,历史一长
        # 那个提交就掉出窗口,取源码这一步自己先失败。
        git fetch -q origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        # 按 SHA 取源不会建 origin/main 引用,仓库里就没有 main 分支了,
        # 而私人仓的 git 历史用例要它 —— 补一个本地 main 指向同一个提交。
        git branch -f main FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        # git 的 --grep 匹配整条消息(含正文),拿标题再 grep 一遍口径不同,
        # 会把"git 明明找到了"判成"没找到"。这里看 git 自己有没有匹配到。
        if [ -z "$(git log --oneline --grep=audit -1)" ]; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ruff
      run: 'pip install ruff==0.16.9 codespell==2.4.3 --break-system-packages -q'
    # 源码这两步是拦人的。用项目自己的 ruff 配置(命令行不再覆盖),
    # 配置漂移会让"本地过了"和"流水线过了"不是同一件事。
    - name: Ruff check (lint)
      run: 'ruff check forgemind/ scripts/ --output-format=github'
    - name: Ruff format check
      run: 'ruff format --check forgemind/ scripts/ --output-format=github'
    # 测试树只报不拦:那批长名测试文件攒着几千条历史告警,一次全量
    # 重排会把真实改动埋掉 —— 源码那边才是拦人的。
    - name: Ruff check (tests, 只报不拦)
      run: |
        ruff check tests/ --output-format=github \
          || echo "tests: ruff 告警只报不拦"
    - name: Ruff format check (tests, 只报不拦)
      run: |
        ruff format --check tests/ --output-format=github \
          || echo "tests: ruff format 只报不拦"
    - name: Codespell
      # codespell 没有 --output-format 这个参数(那是 flake8 的),带着它
      # codespell 直接报参数错误退出。之前这一行包在 || echo 里,错误一起
      # 被吞了,于是这道门禁其实一次都没真正跑过。
      run: 'codespell forgemind/ --ignore-words=.codespellignore'
    - name: 仓库残留扫描
      run: |
                # 复盘措辞、构建产物、诊断产物、过期副本与许可证头。
                # 工作区应当是干净的,所以先提交再检查。
                python scripts/check_repo_cleanliness.py .
    - name: 自检文档与测试对账
      run: |
                # 自检文档里每条结论都点名了对应的回归测试。
                # 测试被删掉或失效,结论就成了过期说法。
                python scripts/check_audit_references.py docs/AUDIT_3_DIMENSIONS.md
    - name: 依赖声明与实际 import 对账
      run: |
                # 声明了却没用的依赖,让每个用户白下载;用了却没声明的
                # 依赖,装出来的包直接跑不起来。两个方向都要对得上。
                python scripts/check_dependency_declarations.py
    - name: 流水线依赖锁定与项目声明对账
      run: |
                # 流水线用 --no-deps 安装本项目,只装锁定文件里的包。
                # 锁定文件漏掉某个声明过的依赖,对应代码路径在流水线里
                # 根本不会被执行,流水线却显示为绿。
                pip install packaging --break-system-packages -q
                python scripts/check_ci_lock.py
    - name: 版本号声明对账
      run: |
                # 版本号写在 pyproject 与 forgemind/__init__.py 两处,漏改一处,
                # 装出来的包就会报一个和实际代码对不上的版本。
                python scripts/check_version_consistency.py .
    - name: Vulture dead code scan (源码)
      run: |
                pip install vulture --break-system-packages -q
                python -m vulture forgemind/ --min-confidence 100
    # 测试树只报不拦:那里面有一批靠副作用生效的 pytest fixture,
    # vulture 认不出那是 fixture,会报成"未使用的变量"。
    # || 必须和命令写在同一行:折行之后它就成了独立的一条命令,
    # 步骤会以语法错误失败 —— 这道"只报不拦"的检查反而把流水线弄红了。
    - name: Vulture dead code scan (tests, 只报不拦)
      run: |
                python -m vulture tests/ --min-confidence 100 \
                  || echo "tests: vulture 告警只报不拦"

  mirror-security:
    name: 镜像 · 安全扫描
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 取完整历史。私人仓的 git 历史用例会回看很早以前的提交(最早那个
        # audit 命名的提交在两百多个提交之前)。用固定深度取源码,历史一长
        # 那个提交就掉出窗口,取源码这一步自己先失败。
