          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        # git 的 --grep 匹配整条消息(含正文),拿标题再 grep 一遍口径不同,
        # 会把"git 明明找到了"判成"没找到"。这里看 git 自己有没有匹配到。
        if [ -z "$(git log --oneline --grep=audit -1)" ]; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: Heavy concurrency tests
      run: |
        # 这些用例的规模就是设计意图,不是卡死。
        # 单用例 timeout 900s:超时会终止整个进程,不做标记恢复。
        python -m pytest tests/ \
          -m heavy \
          --tb=short -q \
          --timeout=900

  # 全量测试跑在**发布出去的那个 wheel**上。
  #
  # 别的作业验的是源码树,用户装到的是 wheel,这是两句话。加上这一档,
  # 连这句话都不用说了:测的就是用户拿到的那份字节。
  #
  # 而且必须是**发布出去的那一个**,不是这里重新构建的:构建时间与构建
  # 环境都可能不同,重新构建出来的字节未必是用户拿到的那份。
  mirror-wheel-suite:
    name: 镜像 · 全量测试跑在发布出去的 wheel 上
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        ref: main
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 完整历史:这一档跑的是常规档全量用例,其中有私人仓的 git 历史
        # 用例,要翻到一千多条之前的那条提交,浅克隆的历史不够。
        git fetch -q origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        git branch -f main FETCH_HEAD
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    # 下载与安装合成一步:文件名是上一步算出来的,跨不过 step 的边界。
    - name: 把发布出去的那一个 wheel 装进干净环境
      working-directory: .
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist"
        url=$(python3 -c "import re;t=open('pypi/simple/forgemind/index.html',encoding='utf-8').read();print(re.search(r'href=\"([^\"]+)\"',t).group(1))")
        sha=$(python3 -c "import re;t=open('pypi/simple/forgemind/index.html',encoding='utf-8').read();print(re.search(r'sha256=([0-9a-f]{64})',t).group(1))")
        # 存成原名:pip 认的是规范文件名(名称-版本-解释器-abi-平台),
        # 随手改个名会被判成 Invalid wheel filename。
        # 索引里的链接带 #sha256= 片段,先剥掉再取文件名。
        url=${url%%#*}
        name=$(basename "$url")
        echo "下载 $url"
        curl -sSL --retry 5 --retry-delay 5 -o "$GITHUB_WORKSPACE/dist/$name" "$url"
        echo "$sha  $GITHUB_WORKSPACE/dist/$name" | sha256sum -c -
        # 核对 wheel 里的模块与源码一个不少:构建配置漏掉一个子包,
        # 用户装上之后 import 才报错 —— 源码树里那个模块明明在。
        python src/scripts/check_wheel_contents.py "$GITHUB_WORKSPACE/dist/$name" src
        python -m venv "$GITHUB_WORKSPACE/v"
        "$GITHUB_WORKSPACE/v/bin/pip" install -q --upgrade pip
        # 连依赖一起装,跟真实用户一样
        "$GITHUB_WORKSPACE/v/bin/pip" install -q "$GITHUB_WORKSPACE/dist/$name"
        "$GITHUB_WORKSPACE/v/bin/pip" install -q pytest pytest-asyncio pytest-timeout
    - name: 全量测试跑在这个环境上
      run: |
        # PYTHONSAFEPATH:不让 `python -m` 把当前目录塞进 sys.path。
        # 塞进去的话 import forgemind 命中的是源码树,不是装出来的轮子 ——
        # 那测的就还是源码,这一档白跑。
        PYTHONSAFEPATH=1 "$GITHUB_WORKSPACE/v/bin/python" -m pytest tests/ \
          -k "not Benchmark and not test_phase11_mega" \
          -m "not heavy" --tb=short -q --timeout=300

  mirror-ui:
    name: 镜像 · UI 测试 (Next.js + Jest)
    needs: resolve-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/forgemind-ui
    steps:
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 取完整历史。私人仓的 git 历史用例会回看很早以前的提交(最早那个
        # audit 命名的提交在两百多个提交之前)。用固定深度取源码,历史一长
        # 那个提交就掉出窗口,取源码这一步自己先失败。
        git fetch -q origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        # 按 SHA 取源不会建 origin/main 引用,仓库里就没有 main 分支了,
        # 而私人仓的 git 历史用例要它 —— 补一个本地 main 指向同一个提交。
        git branch -f main FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        # git 的 --grep 匹配整条消息(含正文),拿标题再 grep 一遍口径不同,
        # 会把"git 明明找到了"判成"没找到"。这里看 git 自己有没有匹配到。
        if [ -z "$(git log --oneline --grep=audit -1)" ]; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: src/forgemind-ui/package-lock.json
    # 私人仓用 hashFiles('forgemind-ui/package.json') 守卫。镜像里源码在
    # src/ 下,路径不同 —— 守卫若照抄会静默跳过全部步骤,作业报绿却什么都没跑。
    # 这里改成直接断言文件存在:文件不在就失败,不会假装跑过。
    - name: 确认界面源码在位
      run: test -f package.json
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps --no-audit
    - name: TypeScript type check
      run: npm run type-check
    - name: Build
      run: npm run build
    - name: Run Jest tests
      run: ./node_modules/.bin/jest
    - name: 界面数据来源核对
      run: |
                  # 界面上的数值必须来自后端。组件里留着固定的指标值,
                  # 界面看起来正常,后端却可能早已不返回这些数。
                  python ../scripts/check_ui_data_driven.py components
    - name: 界面 mock 隔离核对
      run: |
                  # mock 只应活在测试里。构建配置或业务源码一旦引用
                  # __mocks__,真机上就会显示编造的数据,而测试还是全绿。
                  python ../scripts/check_ui_mock_isolation.py .
    - name: 空态区分核对
      run: |
                  # 取数失败时界面要说得出是失败,不能笼统写"暂无数据" ——
                  # 用户会以为自己没数据,其实是后端连不上。判据是组件测试
                  # 真的断言了这一点,所以这里只检查那条测试在不在。
                  python ../scripts/check_ui_empty_state.py .

  mirror-audit:
    name: 镜像 · 完整性对账
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 装解析工作流用的库
      run: pip install pyyaml ruff==0.16.9 codespell==2.4.3 --break-system-packages -q
    - name: 取私人仓源码
      working-directory: .
      shell: bash
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
      run: |
        set -euo pipefail
        mkdir -p src && cd src
        git init -q
        git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
        # 取构件用的那个提交,不是"当前的 main" —— 两者可能不是一回事,
        # 测的不是发布的那个就等于白测。
        # 取完整历史。私人仓的 git 历史用例会回看很早以前的提交(最早那个
        # audit 命名的提交在两百多个提交之前)。用固定深度取源码,历史一长
        # 那个提交就掉出窗口,取源码这一步自己先失败。
        git fetch -q origin "$SOURCE_COMMIT"
        git checkout -q FETCH_HEAD
        # 按 SHA 取源不会建 origin/main 引用,仓库里就没有 main 分支了,
        # 而私人仓的 git 历史用例要它 —— 补一个本地 main 指向同一个提交。
        git branch -f main FETCH_HEAD
        echo "private source @ $(git rev-parse --short HEAD)"
        # 把 git 历史用例依赖的前提变成显式断言。深度不够时那些用例会
        # 以"断言失败"的样子红掉,看不出是取源码太浅。
        n=$(git rev-list --count HEAD)
        if [ "$n" -lt 10 ]; then
          echo "私人仓历史只有 $n 条,浅克隆会让 git 历史用例失效" >&2
          exit 1
        fi
        # git 的 --grep 匹配整条消息(含正文),拿标题再 grep 一遍口径不同,
        # 会把"git 明明找到了"判成"没找到"。这里看 git 自己有没有匹配到。
        if [ -z "$(git log --oneline --grep=audit -1)" ]; then
          echo "历史里没有 audit 命名的提交,取源码深度不够" >&2
          exit 1
        fi
        echo "history commits: $n"
    # 镜像漏掉任何一条检查,"公开仓全绿 ⇒ 私人仓全绿"就不成立,
    # 而且没人会察觉 —— 所以这一步自己也要被机器盯着。
    - name: 核对镜像是否覆盖私人仓的门禁
      run: python scripts/check_ci_mirror.py --private src
    # README 承诺的每一道关卡都要真有一条作业在跑。删掉一个作业而
    # 表格还在,读者会以为那道关卡仍然在跑。
    - name: 核对 README 承诺的关卡
      run: python scripts/check_readme_gates.py README.md
    - name: Workflow shell 声明检查
      # 公开仓自己的工作流也有 Windows runner,bash 语法没声明 shell
      # 会在那边直接跑不起来。
      run: python scripts/check_workflow_shell.py
    - name: 发布清理逻辑核对
      # 发布时删旧构建目录那一步:目录里的文件删完后,目录自身的 sha 就变了,
      # 还拿旧 sha 去删只会 404,空目录就一个个留在仓库里。这条用工作流里
      # 的原码跑一遍,不是抄一份。
      run: python scripts/test_ship_purge.py
    - name: Ruff check (公开仓脚本)
      # 公开仓的脚本以前没人查过 —— 这里面的检查器本身就是门禁,
      # 写错了不会有人发现。
      run: 'ruff check scripts/ --output-format=github'
    - name: Ruff format check (公开仓脚本)
      run: 'ruff format --check scripts/ --output-format=github'
    - name: Codespell (公开仓脚本)
      run: 'codespell scripts/'
    - name: 核对检查器都接进了流水线
      # 检查器写了却没人调用,看起来门禁齐了,实际一道都没生效。
      run: python scripts/check_gates_wired.py --public . --private src
    - name: 核对测的就是发的那个提交
      shell: bash
      run: |
        set -euo pipefail
        want=$(python3 -c "import json;print(json.load(open('releases/builds/manifest.json')).get('source_commit',''))")
        got=$(git -C src rev-parse HEAD)
        if [ -z "$want" ]; then
          echo "清单里没有 source_commit,无法核对来源" >&2
          exit 1
        fi
        if [ "$want" != "$got" ]; then
          echo "测的提交与构件来源不一致: 测的是 $got,构件是 $want" >&2
          exit 1
        fi
        {
          echo "### 构件来源"
          echo "
          echo "| 项 | 值 |"
          echo "| --- | --- |"
          echo "| 构件来源提交 | \`$got\` |"
          echo "| 本次镜像实测提交 | \`$got\` |"
          echo "| 私人仓门禁 | 镜像 4 条工作流,逐条命令核对 |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "测的就是发的那个提交: $got"

  mirror-status:
    name: 镜像 · 汇总校验结论
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
    - name: 汇总本镜像各作业结论
      uses: actions/github-script@v7
      with:
        script: |
          // workflow_run 触发时 context.run 是 undefined(事件载荷里没有
          // run 对象),当前 run 的 id 只能从环境变量拿。
          // Octokit 里没有 listJobs,按 run 列作业要走
          // listJobsForWorkflowRun,它同时要 workflow_id —— 从
          // GITHUB_WORKFLOW_REF 里取文件名的后半段,文件改名也不会失效。
          const runId = Number(process.env.GITHUB_RUN_ID);
          const ref = process.env.GITHUB_WORKFLOW_REF || '';
          const workflowId = (ref.split('/.github/workflows/')[1] || '').split('@')[0]
            || 'ci-mirror.yml';
          let lines;
          try {
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              run_id: runId,
            });
            lines = data.jobs.map(
              (j) => `| ${j.name} | ${j.conclusion || j.status} |`);
          } catch (err) {
            // 这个作业只是把结论写进运行摘要,取不到就把原因写进去,
            // 不该让整个作业标红 —— 它本来就不参与门禁。
            lines = [`| 取作业结论失败 | ${err.message} |`];
          }
          const body = [
            '### 镜像校验结论',
            '',
            '| 镜像作业 | 结论 |',
            '| --- | --- |',
            ...lines,
            '',
            `提交: ${context.sha}`,
          ].join('\n');
          await core.summary.addRaw(body).write();
