name: ForgeMind Security Scan
'on':
  push:
    branches:
    - main
    - develop
    paths-ignore:
    - ci-status.json
    - releases/**
    - pypi/**
    - ci-diagnostics*
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 记录依赖安装结果
      if: always()
      continue-on-error: true
      run: |
        # 安装结果写进运行摘要并作为构建产物上传,不写回仓库。
                  set -uo pipefail
                  {
                    echo '### 依赖安装结果'
                    echo ''
                    echo '```'
                    # 没有匹配行是**正常情况**(安装没出错) —— grep 无匹配时
                    # 返回 1,配上 pipefail 会把作业判红。这里不让它影响结论。
                    grep -inE 'error|could not|no matching|conflict|failed|not found|aborting|Killed' \
                      /tmp/pip-all.log 2>/dev/null | head -40 || echo '(日志里没有匹配到错误行)'
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
    - name: 校验依赖安装
      run: |
        python scripts/check_ci_deps.py
    - name: 上传依赖安装日志
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: pip-install-log
        path: /tmp/pip-all.log
        if-no-files-found: ignore
    - name: pip-audit 依赖漏洞扫描
      run: |
        pip install --break-system-packages -q pip-audit
        # 审计上面安装的这批项目依赖,--local 排除 runner 镜像自带的系统包。
        # 后者与本项目无关,却会稳定报出一批无关告警,使这条检查失去判别力。
        # 已知且当前无法修复的条目登记在 pip-audit.toml,参数由脚本统一读出。
        pip-audit --local --progress-spinner=off $(python scripts/pip_audit_ids.py)
    - name: 秘密扫描
      run: |
        # 版本固定,保证每次扫描的检测能力一致。
        pip install --break-system-packages -q "detect-secrets==1.5.0"
        # 直接扫描全仓。基线文件不豁免任何检出项,只带来插件版本
        # 不匹配的问题,移除后扫描的判定更严格。
        detect-secrets scan .
