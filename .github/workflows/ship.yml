name: ship

# 打包与发布:源码就在这个仓里,构建用的副本从本次发布的提交 archive
# 出来。三个构建(轮子与三个平台的二进制)全部钉在同一个提交上。

on:
  push:
    # 只从 main 发布。少了这个分支过滤,推到任何分支都会触发发布 ——
    # 没审过的代码会被推成用户下载到的"最新版",索引也跟着指过去。
    branches:
    - main
    paths-ignore:
      - 'releases/**'
      - 'pypi/**'
  workflow_dispatch:

permissions:
  contents: write
  # 发布前要读门禁那几档作业的结论(actions: read)。
  actions: read

# 发布不打断:一次发布被打断会留下半发布的构件(资产传了一半、索引还没指),
# 那比排队久一点糟糕得多。
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先把"这次发布用哪个提交"定下来,后面所有构建都钉在它上面。
  # 三个构建各自 fetch main 的话,main 一动就可能拿到不同的提交 ——
  # wheel 与三个二进制来自不同代码,这种不一致没有任何检查会发现。
  resolve-source:
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      publish_version: ${{ steps.version.outputs.version }}
    steps:
      # 源码就在这个仓里:构建用的副本是从本次发布的提交 archive 出来的。
      # 完整历史是必需的 —— 浅克隆拿不到那个提交。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve source commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # 源码就在这个仓里。发布用的提交就是触发这次发布的那一个 ——
          # 三个构建(轮子与三个平台)全部钉在它上面,不会出现"轮子来自
          # 一个提交、二进制来自另一个"的情况。
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "源码提交 @ $(git rev-parse --short HEAD)"
      - name: 算这次发布的版本号
        id: version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # 同一个版本号、内容却变了,pip 是不会升级的:已装过的机器再执行
          # 同一条安装命令,pip 看到"这个版本已经满足"就不重新下载 —— 用户
          # 永远拿不到后来发布的构建(实测过)。每次发布给一个新的 post 号,
          # 版本单调递增,pip 才认得出这是更新的。
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          # 上一次发布用过的版本号:清单里记着(第一次发布时清单里还没这个字段)
          prev=$(curl -sS --max-time 60 \
            https://raw.githubusercontent.com/bin1732/forgemind-pypi/main/releases/builds/manifest.json \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('published_version',''))" \
            2>/dev/null || true)
          version=$(python3 scripts/publish_version.py --base "$base" --previous "$prev")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "发布版本 @ $version (基础版本 $base,上一次 ${prev:-无})"

  build-wheel:
    needs: resolve-source
    runs-on: ubuntu-26.04
    steps:
      # 源码就在这个仓里:构建用的副本是从本次发布的提交 archive 出来的。
      # 完整历史是必需的 —— 浅克隆拿不到那个提交。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 取出构建用的源码副本
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          # 只取受版本控制的文件:构建产物、缓存、发布产物都不带进去。
          # 副本是为了在上面打这次发布的版本号,不动仓库里的声明。
          mkdir -p here
          git archive "$SOURCE_COMMIT" | tar -x -C here
          echo "源码副本 @ ${SOURCE_COMMIT:0:8}"
          ls here | head

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 打上这次发布的版本号
        working-directory: here
        shell: bash
        run: |
          set -euo pipefail
          # 仓库里的四处声明保持基础版本不动 —— 那是维护者抬大版本的地方。
          # 构建用的这份副本打上发布版本,于是装出来的包与独立二进制报的
          # 都是"这次发布"的版本。
          python scripts/apply_publish_version.py . \
            "${{ needs.resolve-source.outputs.publish_version }}"

      - name: Build wheel + sdist
        working-directory: here
        run: |
          pip install --break-system-packages build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: here/dist/

  build-standalone:
    needs: resolve-source
    # 只在发布面那个仓里构建。镜像仓(公开仓的拷贝)不需要再构建一遍
    # 三个平台的二进制 —— 那是白烧 macOS 配额,还会多传 500MB。
    # 镜像仓要跑的是验证(测试、桌面端、真跑二进制),那部分照跑。
    if: github.repository == 'bin1732/forgemind-pypi'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-26
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      # 源码就在这个仓里:构建用的副本是从本次发布的提交 archive 出来的。
      # 完整历史是必需的 —— 浅克隆拿不到那个提交。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 取出构建用的源码副本
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          # 只取受版本控制的文件:构建产物、缓存、发布产物都不带进去。
          # 副本是为了在上面打这次发布的版本号,不动仓库里的声明。
          mkdir -p here
          git archive "$SOURCE_COMMIT" | tar -x -C here
          echo "源码副本 @ ${SOURCE_COMMIT:0:8}"
          ls here | head

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 打上这次发布的版本号
        working-directory: here
        shell: bash
        run: |
          set -euo pipefail
          # 必须在装包之前打:下面 pip install "." 装的是这份副本,
          # 独立二进制打的是装进去的那份 —— 版本号打晚了,二进制报的还是
          # 基础版本。
          python scripts/apply_publish_version.py . \
            "${{ needs.resolve-source.outputs.publish_version }}"

      - name: Install deps
        shell: bash
        run: |
          cd here
          python3 -m pip install --break-system-packages --upgrade pip setuptools wheel
          python3 -m pip install --break-system-packages "."
          python3 -m pip install --break-system-packages pyinstaller

      - name: 确认构建用的版本号
        shell: bash
        # 工作目录是仓库根(不是 here):从 here 里 import 命中的会是源码
        # 树,不是装出来的那份 —— 要看的就是装出来的那份报什么。
        run: |
          set -euo pipefail
          # 源码里的声明、装出来的包、期望的发布版本,三者必须一致。
          # 对不上时打出来的二进制报的就是错的版本,而从外面看不出来 ——
          # 构件的字节数与校验值都是对的,只有版本号不对。
          want="${{ needs.resolve-source.outputs.publish_version }}"
          src=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' here/forgemind/__init__.py | head -1)
          # 在没有源码树的目录里导入:仓库根现在就有 forgemind/,当前目录
          # 优先于已安装的包,那样量到的会是源码树,不是装出来的那份。
          installed=$(cd "$(mktemp -d)" && python3 -c "import forgemind; print(forgemind.__version__)")
          echo "want=$want src=$src installed=$installed"
          if [ "$src" != "$want" ] || [ "$installed" != "$want" ]; then
            echo "FAIL: 构建用的版本号对不上(期望 $want / 源码 $src / 装出来的 $installed)"
            exit 1
          fi

      - name: Build standalone
        shell: bash
        working-directory: here
        run: |
          ENTRY=$(python3 -c "import forgemind.cli; print(forgemind.cli.__file__)")
          PKG_PATH=$(python3 -c "import forgemind, os; print(os.path.dirname(forgemind.__file__))")
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-2025" ]; then
            NAME="forgemind-windows-x64.exe"
          else
            NAME="forgemind-${{ matrix.name }}"
          fi
          pyinstaller --onefile --noconfirm --clean \
            --name "$NAME" \
            --paths "$PKG_PATH" \
            --collect-all forgemind --collect-all langchain --collect-all langgraph \
            --collect-all fastapi --collect-all polars --collect-all platformdirs \
            --console \
            --exclude-module pkg_resources --exclude-module torch --exclude-module pyarrow \
            "$ENTRY"
          mv "dist/$NAME" out/
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.name }}
          path: here/out/

  ship:
    needs: [resolve-source, build-wheel, build-standalone]
    # 构建失败也要走到这里。缺了构件就不发布,但要把话说清楚:
    # 是哪个平台没拿到、为什么、用户现在装到的是哪一版。
    # 原来靠 needs 的失败把这一步跳过,页面上只剩一个"skipped",
    # 看不出是代码坏了还是平台没给 runner —— 这两种要分开。
    #
    # 镜像仓不发布:发布面只有公开仓一个。镜像的职责是**再验一遍**,
    # 不是再发一遍。
    if: always() && github.repository == 'bin1732/forgemind-pypi'
    runs-on: ubuntu-26.04
    env:
      # 构件的来源提交。写进清单,镜像才有可能去测同一个提交 ——
      # 否则"测过的"与"发出去的"可能不是一回事。
      SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 核对构件齐不齐
        id: assets
        shell: bash
        run: |
          set -uo pipefail
          missing=""
          for p in linux macos windows; do
            if [ -z "$(ls -A "artifacts/standalone-$p" 2>/dev/null)" ]; then
              missing="$missing $p"
            fi
          done
          if [ -z "$(ls -A artifacts/wheel 2>/dev/null)" ]; then
            missing="$missing wheel"
          fi
          echo "缺少的构件:${missing:- 无}"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - name: 门禁没绿就不发布
        uses: actions/github-script@v9
        with:
          # 判据在仓里( scripts/gate_check.js ),能被单独验:
          # 门禁该拦的时候放行,比没有门禁更糟 —— 流水线一片绿,发出去的
          # 东西没人验过。
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/gate_check.js`);
            await gate.run({ github, context, core });

      - name: Publish artifacts
        if: steps.assets.outputs.missing == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_COMMIT" ]; then
            echo "FAIL: 没能定出这次发布的提交 —— 上游作业没成功,这次不发布"; exit 1
          fi
          # 发布逻辑在 scripts/publish.py。**一次发布只往 main 上落两个
          # 提交**:一个是构件 + 索引 + 清单,一个是清理旧构建。
          #
          # 提交一多就要出事:每个提交都会触发一次 GitHub Pages 部署,而
          # 同一个站点同时只能有一个部署在进行。一次发布落七八个提交,
          # 部署队列就排起来,线上索引要几十分钟才切过去 —— 那段时间里
          # "用户按索引装到的"和"清单说的"不是同一份产物,版本号一样、
          # 内容不一样。
          python3 scripts/publish.py \
            --build-id "${{ github.run_id }}" \
            --source-commit "$SOURCE_COMMIT" \
            --publish-version "${{ needs.resolve-source.outputs.publish_version }}" \
            --artifacts artifacts

      - name: 构件不齐 —— 这次不发布,把话说清楚
        if: steps.assets.outputs.missing != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "FAIL: 这次发布没有进行 —— 缺少构件:${{ steps.assets.outputs.missing }}"
          echo
          echo "两种可能,处理方式不同:"
          echo "  1) 那个平台的构建真的失败了 —— 看该平台作业的最后一步,"
          echo "     那里有真正的报错。"
          echo "  2) 那个平台的作业停在排队、一条 step 都没有 —— 那是平台"
          echo "     没给 runner(供给或配额),不是代码的问题。作业会在排队"
          echo "     15 分钟后被平台取消,页面上看着像失败,其实是没开工。"
          echo
          live=$(python3 -c "import json;print(json.load(open('releases/builds/manifest.json')).get('published_version','(未知)'))" 2>/dev/null || echo "(未知)")
          echo "用户现在装的仍是上一次完整发布:$live"
          echo "(索引与清单都还指着那一版,没有半发布的产物。)"
          exit 1
