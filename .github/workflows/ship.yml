name: ship

# 公开仓只做打包/测试场:源码在私人仓 bin1732/forgemind,CI 由此处拉取后构建。
# 需要的 secret: PRIVATE_REPO_TOKEN(对私人仓有 contents:read 权限的 PAT)

on:
  push:
    paths-ignore:
      - 'releases/**'
      - 'pypi/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private source
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p here
          cd here
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "源码 @ $(git rev-parse --short HEAD)"
          ls | head

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel + sdist
        working-directory: here
        run: |
          pip install --break-system-packages build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: here/dist/

  build-standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch private source
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p here
          cd here
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "源码 @ $(git rev-parse --short HEAD)"
          ls | head

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: bash
        run: |
          cd here
          python3 -m pip install --break-system-packages --upgrade pip setuptools wheel
          python3 -m pip install --break-system-packages ".[dev]"
          python3 -m pip install --break-system-packages pyinstaller

      - name: Build standalone
        shell: bash
        working-directory: here
        run: |
          ENTRY=$(python3 -c "import forgemind.cli; print(forgemind.cli.__file__)")
          PKG_PATH=$(python3 -c "import forgemind, os; print(os.path.dirname(forgemind.__file__))")
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NAME="forgemind-windows-x64.exe"
          else
            NAME="forgemind-${{ matrix.name }}"
          fi
          pyinstaller --onefile --noconfirm --clean \
            --name "$NAME" \
            --paths "$PKG_PATH" \
            --collect-all forgemind --collect-all langchain --collect-all langgraph \
            --collect-all fastapi --collect-all polars --collect-all platformdirs \
            --console \
            --exclude-module pkg_resources --exclude-module torch --exclude-module pyarrow \
            "$ENTRY"
          mv "dist/$NAME" out/
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: here/out/

  ship:
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json, pathlib, requests
          token = os.environ['GITHUB_TOKEN']
          api = 'https://api.github.com/repos/bin1732/forgemind-pypi'
          s = requests.Session()
          s.headers.update({'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})

          rel = s.get(f'{api}/releases/tags/continuous').json()
          if 'assets' not in rel:
              rel = s.post(f'{api}/releases', json={
                  'tag_name': 'continuous', 'name': 'Continuous Builds',
                  'body': 'Auto-built from private source.', 'prerelease': True}).json()
          # 同名资源必须先删,否则 422
          for a in rel.get('assets', []):
              print(f'  [del] {a["name"]}')
              s.delete(a['url'])

          uploaded = []
          for f in sorted(pathlib.Path('artifacts').rglob('*')):
              if not f.is_file():
                  continue
              name = f.name
              size = f.stat().st_size
              with open(f, 'rb') as fp:
                  r = s.post(f"{api}/releases/{rel['id']}/assets?name={name}",
                             data=fp,
                             headers={'Content-Type': 'application/octet-stream'})
              print(f'  [{r.status_code}] asset {name} ({size//1024//1024}MB)')
              if r.status_code in (200, 201):
                  uploaded.append(name)

          # wheel/sdist 走 Contents API,并同步刷新 PyPI 索引
          import hashlib
          for f in sorted(pathlib.Path('artifacts').rglob('*')):
              if not f.is_file() or f.suffix not in ('.whl', '.gz'):
                  continue
              blob = f.read_bytes()
              rp = f'releases/builds/source/{f.name}'
              ex = s.get(f'{api}/contents/{rp}')
              d = {'message': f'Build: {f.name}', 'content': base64.b64encode(blob).decode(), 'branch': 'main'}
              if ex.status_code == 200:
                  d['sha'] = ex.json()['sha']
              print(f'  [{s.put(f"{api}/contents/{rp}", json=d).status_code}] {rp}')
              if f.suffix == '.whl':
                  sha = hashlib.sha256(blob).hexdigest()
                  html = ('<!DOCTYPE html>\n<html>\n  <body>\n    <a href="https://raw.githubusercontent.com/'
                          f'bin1732/forgemind-pypi/main/{rp}#sha256={sha}">{f.name}</a><br/>\n  </body>\n</html>\n')
                  exi = s.get(f'{api}/contents/pypi/simple/forgemind/index.html')
                  di = {'message': 'Update PyPI index', 'content': base64.b64encode(html.encode()).decode(), 'branch': 'main'}
                  if exi.status_code == 200:
                      di['sha'] = exi.json()['sha']
                  print(f'  [{s.put(f"{api}/contents/pypi/simple/forgemind/index.html", json=di).status_code}] index.html')

          mf = {'version': 'latest', 'assets': uploaded,
                'source_repo': 'bin1732/forgemind',
                'install': 'pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind'}
          mb = json.dumps(mf, indent=2).encode()
          exm = s.get(f'{api}/contents/releases/builds/manifest.json')
          dm = {'message': 'Manifest', 'content': base64.b64encode(mb).decode(), 'branch': 'main'}
          if exm.status_code == 200:
              dm['sha'] = exm.json()['sha']
          print(f'  [{s.put(f"{api}/contents/releases/builds/manifest.json", json=dm).status_code}] manifest.json')
          PYEOF
