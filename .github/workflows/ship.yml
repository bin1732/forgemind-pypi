name: ship

# 公开仓只做打包/测试场:源码在私人仓 bin1732/forgemind,CI 由此处拉取后构建。
# 需要的 secret: PRIVATE_REPO_TOKEN(对私人仓有 contents:read 权限的 PAT)

on:
  push:
    paths-ignore:
      - 'releases/**'
      - 'pypi/**'
  workflow_dispatch:

permissions:
  contents: write

# 发布不打断:一次发布被打断会留下半发布的构件(资产传了一半、索引还没指),
# 那比排队久一点糟糕得多。
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先把"这次发布用哪个提交"定下来,后面所有构建都钉在它上面。
  # 三个构建各自 fetch main 的话,main 一动就可能拿到不同的提交 ——
  # wheel 与三个二进制来自不同代码,这种不一致没有任何检查会发现。
  resolve-source:
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve source commit
        id: resolve
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p probe && cd probe
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "源码提交 @ $(git rev-parse --short HEAD)"

  build-wheel:
    needs: resolve-source
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch private source
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p here
          cd here
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git checkout -q FETCH_HEAD
          echo "源码 @ $(git rev-parse --short HEAD)"
          ls | head

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build wheel + sdist
        working-directory: here
        run: |
          pip install --break-system-packages build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: here/dist/

  build-standalone:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-26
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch private source
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p here
          cd here
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git checkout -q FETCH_HEAD
          echo "源码 @ $(git rev-parse --short HEAD)"
          ls | head

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        shell: bash
        run: |
          cd here
          python3 -m pip install --break-system-packages --upgrade pip setuptools wheel
          python3 -m pip install --break-system-packages "."
          python3 -m pip install --break-system-packages pyinstaller

      - name: Build standalone
        shell: bash
        working-directory: here
        run: |
          ENTRY=$(python3 -c "import forgemind.cli; print(forgemind.cli.__file__)")
          PKG_PATH=$(python3 -c "import forgemind, os; print(os.path.dirname(forgemind.__file__))")
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-2025" ]; then
            NAME="forgemind-windows-x64.exe"
          else
            NAME="forgemind-${{ matrix.name }}"
          fi
          pyinstaller --onefile --noconfirm --clean \
            --name "$NAME" \
            --paths "$PKG_PATH" \
            --collect-all forgemind --collect-all langchain --collect-all langgraph \
            --collect-all fastapi --collect-all polars --collect-all platformdirs \
            --console \
            --exclude-module pkg_resources --exclude-module torch --exclude-module pyarrow \
            "$ENTRY"
          mv "dist/$NAME" out/
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.name }}
          path: here/out/

  ship:
    needs: [resolve-source, build-wheel, build-standalone]
    runs-on: ubuntu-26.04
    env:
      # 构件的来源提交。写进清单,镜像才有可能去测同一个提交 ——
      # 否则"测过的"与"发出去的"可能不是一回事。
      SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Publish artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import base64, hashlib, json, pathlib, sys, urllib.request, urllib.error, time
          from urllib.parse import quote

          TOKEN = __import__('os').environ['GITHUB_TOKEN']
          API = 'https://api.github.com/repos/bin1732/forgemind-pypi'

          def call(method, url, data=None, headers=None, retries=4):
              h = {'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json'}
              if headers:
                  h.update(headers)
              body = data if isinstance(data, bytes) else (json.dumps(data).encode() if data else None)
              if isinstance(data, dict):
                  h['Content-Type'] = 'application/json'
              for i in range(retries):
                  req = urllib.request.Request(url, data=body, headers=h, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=900) as r:
                          raw = r.read()
                          return r.status, (json.loads(raw) if raw and r.headers.get('content-type','').startswith('application/json') else raw)
                  except urllib.error.HTTPError as e:
                      if e.code in (404, 422):
                          return e.code, None
                      if e.code == 422:
                          return 422, None
                      time.sleep(2 * (i + 1))
                  except Exception:
                      time.sleep(2 * (i + 1))
              return 0, None

          # 1) release: 先删同名资产再上传(Releases API 不允许覆盖)
          st, rel = call('GET', f'{API}/releases/tags/continuous')
          if st != 200 or not rel:
              st, rel = call('POST', f'{API}/releases', {
                  'tag_name': 'continuous', 'name': 'Continuous Builds',
                  'body': 'Auto-built from private source.', 'prerelease': True})
          print(f'release id={rel.get("id")}')
          for a in rel.get('assets', []):
              code, _ = call('DELETE', a['url'])
              print(f'  [del {code}] {a["name"]}')
              time.sleep(1)

          uploaded = []
          asset_sizes = {}
          for f in sorted(pathlib.Path('artifacts').rglob('*')):
              if not f.is_file() or f.name == 'manifest.json':
                  continue
              name, size = f.name, f.stat().st_size
              # 注意:资产上传必须走 uploads.github.com,不是 api.github.com
              upload_url = rel['upload_url'].replace('{?name,label}', '')
              code, _ = call('POST', f'{upload_url}?name={quote(name)}',
                  data=f.read_bytes(),
                  headers={'Content-Type': 'application/octet-stream'})
              print(f'  [asset {code}] {name} ({size // 1024 // 1024}MB)')
              if code in (200, 201):
                  uploaded.append(name)
                  asset_sizes[name] = size

          # 2) wheel/sdist 走 Contents,并同步刷新 PyPI 索引
          for f in sorted(pathlib.Path('artifacts').rglob('*')):
              if not f.is_file() or f.suffix not in ('.whl', '.gz'):
                  continue
              blob = f.read_bytes()
              # 每次构建写到带 build 标识的新路径,再让索引指向它。
              #
              # 分三步执行,顺序保证任何时刻索引声明的 hash 都与文件内容一致:
              #   1. 新文件落到新路径(旧路径仍在,旧索引仍然有效)
              #   2. 索引指向新路径及其真实 hash
              #   3. 删除旧路径(此时已无引用方)
              build_id = __import__('os').environ.get('GITHUB_RUN_ID', 'local')
              rp = f'releases/builds/{build_id}/{f.name}'
              stx, ex = call('GET', f'{API}/contents/{rp}')
              d = {'message': f'Build {build_id}: {f.name}',
                   'content': base64.b64encode(blob).decode(), 'branch': 'main'}
              if stx == 200 and ex:
                  d['sha'] = ex['sha']
              code, _ = call('PUT', f'{API}/contents/{rp}', d)
              print(f'  [{code}] {rp}')
              if f.suffix == '.whl':
                  sha = hashlib.sha256(blob).hexdigest()
                  html = ('<!DOCTYPE html>\n<html>\n  <body>\n    <a href="https://raw.githubusercontent.com/'
                          f'bin1732/forgemind-pypi/main/{rp}#sha256={sha}">{f.name}</a><br/>\n  </body>\n</html>\n')
                  sti, exi = call('GET', f'{API}/contents/pypi/simple/forgemind/index.html')
                  di = {'message': 'Update PyPI index',
                        'content': base64.b64encode(html.encode()).decode(), 'branch': 'main'}
                  if sti == 200 and exi:
                      di['sha'] = exi['sha']
                  code, _ = call('PUT', f'{API}/contents/pypi/simple/forgemind/index.html', di)
                  print(f'  [{code}] pypi index -> {sha[:16]} (path {rp})')

          # 清单写在**产物上传之后、等索引之前**。
          #
          # 顺序有讲究:
          #   * 必须在清理旧构建之前 —— 反过来会出现一段时间里清单还指着
          #     上一次构建,而那个构建已经被删了,按清单核对的人找不到文件,
          #     却什么错都没犯。
          #   * 必须在产物上传之后 —— 清单记的是这次上传的字节数。
          #   * 要在等索引之前 —— 上面那步等线上索引最长要 10 分钟,
          #     清单要是压在那后面,这段时间里"Release 上的资产"已经是
          #     新的、"清单记的字节数"还是旧的,对账作业必然报对不上。
          #     作业若在中途被取消,这个不一致窗口就一直留着。挪到
          #     等待之前,窗口只剩几秒。
          mf = {'version': 'latest', 'assets': sorted(uploaded),
                'sizes': {k: asset_sizes[k] for k in sorted(asset_sizes)},
                # 记下这次构建的编号。验证工作流要靠它确认"清单说的"
                # 与"线上索引指向的"是同一份产物 —— 两者不是同一份时,
                # 清单里的字节数与文件对不上是必然的,而不是出了错。
                'build_id': build_id,
                'source_repo': 'bin1732/forgemind',
                'source_commit': __import__('os').environ.get('SOURCE_COMMIT', ''),
                'install': 'pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/ forgemind'}
          # 清单就地更新,不先删后写:少一次提交,历史里不留删除痕迹
          stm, exm = call('GET', f'{API}/contents/releases/builds/manifest.json')
          dm = {'message': 'Manifest', 'content': base64.b64encode(json.dumps(mf, indent=2).encode()).decode(), 'branch': 'main'}
          if stm == 200 and exm:
              dm['sha'] = exm['sha']
          code, _ = call('PUT', f'{API}/contents/releases/builds/manifest.json', dm)
          print(f'  [{code}] manifest.json')

          # 3) 等线上索引指向本次构建,再清理历史构建目录
          # GitHub Pages 部署新索引有延迟:这段时间里线上索引还指着上一个
          # 构建。立刻把上一个构建删掉,用户按线上索引下载就会拿到 404。
          # 先确认线上索引已经指向本次构建,再清理。
          live_index = 'https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/'
          deadline = time.time() + 600
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(live_index, timeout=30) as r:
                      body = r.read().decode('utf-8', 'ignore')
              except Exception:
                  body = ''
              if f'builds/{build_id}/' in body:
                  print(f'  线上索引已指向 {build_id}')
                  break
              time.sleep(10)
          else:
              print(f'  线上索引未在时限内指向 {build_id},仍按计划清理旧构建')

          # 4) 清理历史构建目录
          # 只保留当前 build 目录;更早的 build 目录全部删除,避免仓库随
          # 每次运行无限增长,也避免 simple index 指向的文件被误删。
          #
          # 但有两类目录**绝不能删**:
          #   线上索引正在指向的那个 —— 删了用户按索引下载就是 404
          #   比本次更新的那些 —— 两次发布并发时,别的作业刚写好的构建目录
          #   会被先跑完的那次删掉,而线上索引已经指向它
          def live_build_id():
              try:
                  with urllib.request.urlopen(live_index, timeout=30) as r:
                      body = r.read().decode('utf-8', 'ignore')
              except Exception:
                  return ''
              marker = 'builds/'
              if marker in body:
                  return body.split(marker, 1)[1].split('/', 1)[0]
              return ''

          def build_num(name):
              try:
                  return int(name)
              except (TypeError, ValueError):
                  return -1

          live_id = live_build_id()
          my_num = build_num(build_id)

          def keep_build(name):
              if name == build_id or name == live_id:
                  return True
              # 比本次更新的构建:多半是并发发布留下的,不能删
              return my_num >= 0 and build_num(name) >= my_num

          print(f'  保留构建目录: 本次 {build_id}'
                f' / 线上索引指向 {live_id or "(未知)"}')

          def list_dir(path):
              st, data = call('GET', f'{API}/contents/{path}')
              return data if st == 200 and isinstance(data, list) else []

          def remove_path(path, sha=None):
              payload = {'message': f'Remove stale build artifact: {path}', 'branch': 'main'}
              if sha:
                  payload['sha'] = sha
              # 删除失败不能只打印:GitHub 的 contents API 在并发提交或
              # 限流时会拒绝,旧构件就会留在仓库里,而发布仍然报成功 ——
              # 下一轮对账才发现,那时候线上索引可能已经指向了残留文件。
              last = 0
              for attempt in range(4):
                  code, _ = call('DELETE', f'{API}/contents/{path}', payload)
                  last = code
                  if code in (200, 404):
                      # 404 表示已经不在了 —— 目标达成,不算失败
                      break
                  print(f'  [{code}] rm {path} 失败,重试')
                  time.sleep(3 * (attempt + 1))
              else:
                  print(f'  [{last}] rm {path} 重试后仍失败', file=sys.stderr)
                  raise SystemExit(1)
              print(f'  [{code}] rm {path}')

          def purge_dir(path, keep_prefix=None, keep_names=(), keep_predicate=None):
              for entry in list_dir(path):
                  name = entry.get('name', '')
                  full = f"{path}/{name}"
                  if keep_prefix and full.startswith(keep_prefix):
                      continue
                  if name in keep_names:
                      continue
                  if keep_predicate is not None and keep_predicate(name):
                      continue
                  if entry.get('type') == 'dir':
                      purge_dir(full)
                      # git 里没有空目录:里面的文件删光之后,这个目录在
                      # GitHub 上就已经不存在了。回父目录看一眼确认 ——
                      # 还在才删。
                      #
                      # 之前这里列的是 path 自己的内容(已经空了),拿到的是
                      # 空字典,于是 sha 传成 None。contents API 删目录必须带
                      # sha,不带就回 422 "sha wasn't supplied";而目录真的
                      # 已经不在了时,带旧 sha 去删会回 404。两种都会把发布
                      # 流程顶红,还留下一个删不掉的报错。
                      parent = path.rsplit('/', 1)[0] if '/' in path else ''
                      fresh = {e.get('name'): e.get('sha') for e in list_dir(parent)}
                      if name not in fresh:
                          continue
                      remove_path(full, fresh[name])
                  else:
                      remove_path(full, entry.get('sha'))

          def purge_builds(build_id, live_id):
              """清理旧构建目录。

              有四样东西不能删:
                本次构建         —— 刚写完的那份
                线上索引指向的   —— 删了用户按索引下载就是 404
                编号更大的构建   —— 并发发布时别的作业刚写好的
                清单文件本身     —— manifest.json 是"发了什么、从哪个提交来"
                                     的机器可读真源。少了它,验证工作流就
                                     找不到这次发布的来源提交,整条"测的就
                                     是发的"链就断掉 —— 之前就是在这儿被
                                     顺手删掉的:写完清单的同一步骤把它当
                                     成旧文件清掉了。
              """
              keep = {'manifest.json'}
              if live_id:
                  keep.add(live_id)
              purge_dir('releases/builds', keep_prefix=f'releases/builds/{build_id}',
                        keep_names=keep, keep_predicate=keep_build)

          # 清单是"发布了什么、多大、从哪个提交来"的机器可读真源。
          # 字节数写在这里,文档与检查都对着它核对,不用在文档里硬编码
          # 会漂移的数字;来源提交也一样 —— 它是"测的"与"发的"能对上的
          # 唯一凭据。
          #
          # 清理旧构建。保留哪些由 purge_builds 决定,那里的规则和理由
          # 写在一起,测试也直接跑那个函数 —— 调用点自己重写一份的测试
          # 守不住调用点。
          purge_builds(build_id, live_id)
          # 早期流程使用的固定路径,当前流程不再写入,一并清理
          purge_dir('releases/source')
          purge_dir('pypi/simple/forgemind', keep_prefix='pypi/simple/forgemind/index.html')
          PYEOF
