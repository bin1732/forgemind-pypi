name: verify

# 真实验证:装完 wheel 后跑完整冒烟,并且**实际执行**三个平台二进制。
# 二进制跑不起来 = 直接判失败,不允许"构建成功"就算过。
#

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# 新的发布会把还在跑的验证顶掉。被顶掉的那次记成 cancelled
# (而不是 failure)—— 它验的是已经被取代的构件,红在那里只会误导人。
concurrency:
  # 三个发布后验证各用各的并发组,互不干涉。
  #
  # 曾经把三个放进同一个组里串行跑,理由是"同一时刻只有一个要 macOS"。
  # 那个设计是反的:GitHub 的并发组只保留**一个**排队中的运行,新运行
  # 进来时先到的那个排队中的会被取消掉 —— 于是每次发布必然有两个验证
  # 被取消,谁活下来取决于谁先排到队,对外是随机结果。
  #
  # 实测(2026-11-04,同一批发布):verify-live 与 wheel-suite 是 success,
  # verify 与 verify-desktop 是 cancelled;换一批提交,被取消的换成另外
  # 两个。被取消的那几次,工作流停在 jobs=0 —— 作业压根没被创建,不是
  # 作业跑了失败。
  #
  # 现在各用各的组:新的一次发布只顶掉**同一个**工作流上一次还在跑的
  # 验证(它验的是已被取代的构件),不同工作流之间不会互相取消。
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-wheel:
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复,而且还要白烧一轮 macOS 配额。
    # 手动触发(w workflow_dispatch)没有上游发布,照跑。
    # 发布面的验证只在发布面那个仓里跑:镜像仓不发布,验的其实是公开仓
    # 发出去的那一份,拿镜像仓的提交去对公开仓的清单必然对不上(假红);
    # 多平台那档还会在镜像里重复烧一遍配额。理由详见 ship.yml。
    if: github.repository == 'bin1732/forgemind-pypi' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-26.04
    steps:
      - name: 检出公开仓
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 读出构件来源提交
        id: source
        uses: ./.github/actions/resolve-source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and install wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --break-system-packages --upgrade pip build
          cd "$GITHUB_WORKSPACE"
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist" .
          python -m venv "$GITHUB_WORKSPACE/.v"
          "$GITHUB_WORKSPACE/.v/bin/pip" install -q --upgrade pip
          "$GITHUB_WORKSPACE/.v/bin/pip" install -q "$GITHUB_WORKSPACE"/dist/*.whl
          # 同样要避开当前目录:仓库根有源码树,导入会优先命中它,量的
          # 就不是装出来的那份了。
          (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/.v/bin/python" -c "import forgemind; print('import ok', forgemind.__version__)")
          # 装出来的 wheel 与源码要对得上:构建配置漏掉一个子包,用户装上
          # 之后 import 才报错 —— 源码树里那个模块明明在,测试也跑得过。
          python scripts/check_wheel_contents.py "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"
          # 这一处装的是**从源码构建**的 wheel,还没打发布版本号,
          # 所以对的是源码声明的基础版本 ✓(发布出来的那一个由下面
          # "构件与声明对账"那档对着清单核 ✓)。
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/pyproject.toml" | head -1)
          actual=$(cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/.v/bin/python" -c "import forgemind; print(forgemind.__version__)")
          echo "declared=$declared actual=$actual"
          [ -n "$declared" ] && [ "$declared" = "$actual" ] \
            || { echo "FAIL: 构件版本($actual)与源码声明($declared)不一致"; exit 1; }

      - name: Assert verify.py itself is lint-clean
        run: |
          pip install -q --break-system-packages ruff==0.16.9
          ruff check --isolated --select E9,F63,F7,F82 "$GITHUB_WORKSPACE/scripts/verify.py"

      - name: Smoke - all CLI subcommands
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/.v/bin"
          for c in info signal router-demo; do
            "$V/forgemind" $c >/dev/null && echo "PASS forgemind $c" || { echo "FAIL forgemind $c"; exit 1; }
          done
          # 这一档装的是**从源码构建**的 wheel,版本就是源码声明的基础
          # 版本 —— 要对的是源码声明 ✓。从 Release 下载的独立二进制才是
          # 对着发布版本比的那个(见 verify-binaries 作业)。
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/pyproject.toml" | head -1)
          actual=$("$V/forgemind" info | sed -n 's/.*Version:[[:space:]]*//p' | tr -d '\r')
          echo "declared=$declared actual=$actual"
          [ -n "$declared" ] && [ "$declared" = "$actual" ] \
            || { echo "FAIL: 构件版本($actual)与源码声明($declared)不一致"; exit 1; }
          "$V/forgemind" backtest --start 2024-01-01 --end 2024-12-31 | grep -q "Total Return" \
            && echo "PASS backtest" || { echo "FAIL backtest"; exit 1; }
          # forgemind agent 现在是两步: prepare + 人工审批。
          # 非交互式 CI 用 --yes 自动批准;无 --yes 时会拒绝自动审批,
          # 那样才是正确的 gating 行为。
          out=$("$V/forgemind" agent --yes --symbol 600519.SH --cash 100000 --position-qty 5 --position-price 1600 2>/dev/null || true)
          echo "$out" | grep -q "snapshot saved" && echo "PASS agent(+snapshot)" \
            || { echo "FAIL agent: output=$out"; exit 1; }

      - name: Smoke - 门面命令与研究示例
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/.v/bin"
          # demo 是 README 上的门面命令:一条命令看到真实结果。它取不到
          # 实时行情时会退到包内置的真实历史行情,离线也跑得起来。
          out=$("$V/forgemind" demo --symbol 600519 --start 2024-01-01 --end 2024-12-31 2>&1)
          echo "$out" | grep -q "3/3 结果" \
            && echo "PASS demo" || { echo "FAIL demo: $(echo "$out" | tail -3)"; exit 1; }
          # 结果里必须声明数据是真实价格 —— 这一句是给用户的承诺
          echo "$out" | grep -q "真实价格,不是模拟数据" \
            || { echo "FAIL demo: 没有声明数据来源"; exit 1; }
          # 研究示例:README 上给用户的另一个入口。它对着**已安装的**包跑。
          "$V/python" scripts/research_demo.py --data-source mock --no-wfo --no-mc --json \
            > "$RUNNER_TEMP/research.json" \
            || { echo "FAIL research_demo 跑不起来"; exit 1; }
          # NaN 与 Infinity 不是合法 JSON,严格的下游解析器会直接报错
          if grep -q "NaN\|Infinity" "$RUNNER_TEMP/research.json"; then
            echo "FAIL research_demo: 结果里有 NaN/Infinity,那不是合法 JSON"; exit 1
          fi
          "$V/python" -c "import json;d=json.load(open('$RUNNER_TEMP/research.json'));assert d['数据']['K 线数']>0;print('PASS research_demo')" \
            || { echo "FAIL research_demo: 结果不完整"; exit 1; }

      - name: Smoke - 每个能跑的策略都跑得出结果
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/.v/bin"
          # 清单从代码里推导,不要在流水线里另列一份 —— 另列的那份会与
          # 命令真正能跑的那份漂移,漂移了就有人照着清单挑一个跑不了的策略。
          # 需要多支标的的策略由下面那一档单独验(它用 Python API 喂多标的)。
          mapfile -t strategies < <("$V/python" -c "
          from forgemind.core.strategies.library import cli_runnable_strategies
          print(*sorted(cli_runnable_strategies()), sep='\n')
          ")
          for s in "${strategies[@]}"; do
            out=$("$V/forgemind" backtest --strategy "$s" --start 2024-01-01 --end 2024-12-31 2>&1)
            echo "$out" | grep -q "Total Return" \
              && echo "PASS $s" || { echo "FAIL $s: $(echo "$out" | tail -1)"; exit 1; }
          done

      - name: Smoke - portfolio strategies switch on multi-symbol data
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.v/bin/python" - <<'EOF'
          import numpy as np
          import pandas as pd
          from forgemind.core.strategies.extended_library import list_strategies
          rng = np.random.default_rng(7)
          rows = []
          for i in range(10):
              drift = rng.normal(0.0004, 0.001)
              c = 100 * np.exp(np.cumsum(rng.normal(drift, 0.015, 300)))
              for d, cl in zip(pd.date_range("2024-01-01", periods=300), c):
                  rows.append({"date": d, "symbol": f"S{i}", "close": cl})
          df = pd.DataFrame(rows)
          for name in ("MaxSharpe", "RiskParity", "CrossSectionalMomentum"):
              sig = list_strategies()[name](lookback=60).generate_signal(df)
              assert len(sig) == len(df), f"{name} 信号长度 {len(sig)} != {len(df)}"
              assert sig.sum() > 0, f"{name} 在多标的数据上无任何信号"
              print(f"PASS {name}: {int(sig.sum())} signals")
          EOF

      - name: Smoke - MCP tools, no fabricated data
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.v/bin/python" - <<'EOF'
          import asyncio
          import json
          from forgemind.mcp.server import ForgeMindMCPServer

          async def main():
              s = ForgeMindMCPServer()
              for name, args in [
                  ("search_features", {"query": "momentum"}),
                  ("get_feature", {"name": "kmid"}),
                  ("trace_feature_usage", {"feature_id": "KMID"}),
                  ("output_signal", {"symbol": "X", "side": "buy", "confidence": 0.8, "rationale": "t"}),
              ]:
                  r = await s.handle_request({
                      "jsonrpc": "2.0", "id": 1, "method": "tools/call",
                      "params": {"name": name, "arguments": args}})
                  assert "error" not in r, f"{name} 失败: {r.get('error')}"
                  print(f"PASS mcp/{name}")
              r = await s.handle_request({
                  "jsonrpc": "2.0", "id": 1, "method": "tools/call",
                  "params": {"name": "query_portfolio", "arguments": {}}})
              p = json.loads(r["result"]["content"][0]["text"])
              assert p.get("status") == "ok", f"query_portfolio 未读到快照: {p}"
              assert p["cash"] == 100000.0, f"cash 不对: {p['cash']}"
              assert p["positions"], "positions 为空"
              print(f"PASS mcp/query_portfolio 真实快照 cash={p['cash']} pos={p['positions']}")
          asyncio.run(main())
          EOF

      - name: Smoke - API endpoints and input validation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'from forgemind.api.main import app' \
            'import uvicorn' \
            'uvicorn.run(app, host="127.0.0.1", port=8095, log_level="error")' \
            > "$GITHUB_WORKSPACE/serve_verify.py"
          "$GITHUB_WORKSPACE/.v/bin/python" "$GITHUB_WORKSPACE/serve_verify.py" &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8095/health >/dev/null && break
            sleep 2
          done
          B=http://127.0.0.1:8095
          for ep in /health /api/v1/info /api/v1/health/services /mcp/tools/list; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$B$ep")
            [ "$code" = "200" ] && echo "PASS GET $ep" || { echo "FAIL GET $ep -> $code"; exit 1; }
          done
          for body in '{"start_date":"bad","end_date":"2024-06-01"}' \
                      '{"start_date":"2024-06-01","end_date":"2024-01-01"}' \
                      '{"start_date":"2024-01-01","end_date":"2024-06-01","fast_period":50,"slow_period":10}'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/v1/backtest/run" \
                   -H 'Content-Type: application/json' -d "$body")
            [ "$code" = "422" ] && echo "PASS 422" || { echo "FAIL expected 422 got $code for $body"; exit 1; }
          done
          R=$(curl -s "$B/api/v1/health/services")
          for leak in "127.0" "::1" "password" "Traceback" "site-packages"; do
            echo "$R" | grep -qi "$leak" && { echo "FAIL 泄露 $leak"; exit 1; } || echo "PASS 无泄露 $leak"
          done

  # 用户视角的验证:只用公开渠道拿到的产物,不碰本地源码。
  user-journey:
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复,而且还要白烧一轮 macOS 配额。
    # 手动触发(w workflow_dispatch)没有上游发布,照跑。
    # 发布面的验证只在发布面那个仓里跑:镜像仓不发布,验的其实是公开仓
    # 发出去的那一份,拿镜像仓的提交去对公开仓的清单必然对不上(假红);
    # 多平台那档还会在镜像里重复烧一遍配额。理由详见 ship.yml。
    if: github.repository == 'bin1732/forgemind-pypi' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    name: 真实用户旅程
    runs-on: ubuntu-26.04
    steps:
      - name: 检出公开仓
        uses: actions/checkout@v7
        with:
          path: public-repo
          ref: main
        # 只从公开索引页出发,脚本自身也在公开仓里
      - name: 从公开索引页出发走一遍
        run: |
          cd public-repo
          python scripts/verify_user_journey.py
      - name: 核对 README 承诺的关卡
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml --break-system-packages -q
          cd public-repo
          python scripts/check_readme_gates.py README.md
  # 构件、清单、索引与私人仓文档里声明的内容必须对得上。
  # 这一层没人守的话,旧构建会一直留在仓库里,文档里的声明也会悄悄过期。
  verify-assets:
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复,而且还要白烧一轮 macOS 配额。
    # 手动触发(w workflow_dispatch)没有上游发布,照跑。
    # 发布面的验证只在发布面那个仓里跑:镜像仓不发布,验的其实是公开仓
    # 发出去的那一份,拿镜像仓的提交去对公开仓的清单必然对不上(假红);
    # 多平台那档还会在镜像里重复烧一遍配额。理由详见 ship.yml。
    if: github.repository == 'bin1732/forgemind-pypi' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    name: 构件与声明对账
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # 检出**最新那次发布**的提交,不是 main 的当前快照。
      # 发布流程会往 main 提交清单与索引,而本工作流是被 ship 触发的:
      # 触发的那一刻 main 上可能还没有这次发布的提交,拿那个快照去核对
      # 清单与文件,比的其实是两次不同的构建,必然对不上。
      - name: 找出最近一次发布的提交
        id: rel
        uses: actions/github-script@v9
        with:
          script: |
            // 按**内容**找,不按提交信息的措辞找:发布流程改过一次写法
            // (一次发布只落两个提交,清单与构件在同一个提交里),按措辞
            // 找就会把旧那次发布的提交当成这次 —— 拿旧清单核对新构件,
            // 必然对不上,而错误信息说的是"字节数不一致",看不出是找错了
            // 提交。清单是"发了什么"的真源,最后改过它的那个提交就是
            // 要核对的那一次。
            const { data } = await github.rest.repos.listCommits({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: 'main', path: 'releases/builds/manifest.json', per_page: 1,
            });
            const hit = data[0];
            if (!hit) core.setFailed('main 上找不到改过清单的提交');
            else { core.setOutput('sha', hit.sha); console.log(hit.sha); }
      - name: 检出公开仓
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.rel.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 读出构件来源提交
        id: source
        uses: ./.github/actions/resolve-source
      - name: 核对构件、清单、索引与文档声明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # README 给用户看的下载物必须真的在这次发布的清单里。
          python scripts/check_published_assets.py \
            --doc-mentions "$GITHUB_WORKSPACE/README.md"
  verify-binaries:
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复,而且还要白烧一轮 macOS 配额。
    # 手动触发(w workflow_dispatch)没有上游发布,照跑。
    # 发布面的验证只在发布面那个仓里跑:镜像仓不发布,验的其实是公开仓
    # 发出去的那一份,拿镜像仓的提交去对公开仓的清单必然对不上(假红);
    # 多平台那档还会在镜像里重复烧一遍配额。理由详见 ship.yml。
    if: github.repository == 'bin1732/forgemind-pypi' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux
          - os: windows-2025
            name: windows
          - os: macos-26
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the released binary
        shell: bash
        run: |
          # 资产名带发布版本:名字不变的资产,GitHub 的 CDN 会继续发旧副本,
          # 下到的会是有意为之的上一个构建。版本从清单里读 —— 清单记的
          # 就是这次发布用的名字。
          version=$(curl -sS --max-time 60 \
            https://raw.githubusercontent.com/bin1732/forgemind-pypi/main/releases/builds/manifest.json \
            | jq -r '.published_version // ""')
          if [ -z "$version" ]; then
            echo "FAIL: 清单里没有 published_version"; exit 1
          fi
          if [ "${{ matrix.os }}" = "windows-2025" ]; then
            NAME="forgemind-${version}-windows-x64.exe"
            LOCAL="forgemind-windows-x64.exe"
          else
            NAME="forgemind-${version}-${{ matrix.name }}"
            LOCAL="forgemind-${{ matrix.name }}"
          fi
          # 下载用带版本号的名字(CDN 才没有旧副本可发),落盘后改回稳定名 ——
          # 后面执行时用的还是那个名字。
          # release 资产 URL 不变时会被 CDN 缓存,必须破坏缓存才能验到新版
          URL="https://github.com/bin1732/forgemind-pypi/releases/download/continuous/${NAME}?cb=${GITHUB_RUN_ID}"
          # ship.yml 为绕开"同名上传 422"会先删旧资产再上传同名资产,
          # 那个空窗期里下载会拿到 404 —— 而这里的 404 是**暂时性**的。
          # curl --retry 只重试 5xx/超时,遇 404 直接放弃;没有 --fail 时,
          # 404 的响应体("Not Found",9 字节)还会被当成内容写进文件,
          # 要到后面的大小检查才暴露。所以显式轮询 + --fail。
          ok=0
          for i in $(seq 1 12); do
            if curl -sSLf --max-time 1800 -o "$NAME" "$URL" && [ -s "$NAME" ]; then
              ok=1; break
            fi
            echo "  尝试 $i/12 失败(资产可能正被 ship 替换),重读清单后重试"
            sleep 15
            # 重读一次清单。资产名带着版本号,而发布会把上一版的资产换掉 ——
            # 名字不跟着清单走,重试再多次也只会一直 404。
            version=$(curl -sS --max-time 60 \
              https://raw.githubusercontent.com/bin1732/forgemind-pypi/main/releases/builds/manifest.json \
              | jq -r '.published_version // ""')
            if [ -n "$version" ]; then
              if [ "${{ matrix.os }}" = "windows-2025" ]; then
                NAME="forgemind-${version}-windows-x64.exe"
              else
                NAME="forgemind-${version}-${{ matrix.name }}"
              fi
              URL="https://github.com/bin1732/forgemind-pypi/releases/download/continuous/${NAME}?cb=${GITHUB_RUN_ID}-${i}"
            fi
          done
          if [ "$ok" != "1" ]; then echo "FAIL 下载失败(重试已耗尽)"; exit 1; fi
          # 下载用的资产名里带着哪个版本,就把哪个版本记下来:后面核对
          # 构件报的版本时对着它比,而不是对着可能已经变了的清单。
          echo "$version" > .asset_version
          mv "$NAME" "$LOCAL"
          SIZE=$(wc -c < "$LOCAL")
          echo "downloaded $LOCAL ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "FAIL: 文件过小($SIZE),很可能拿到的是错误页而不是二进制"
            head -c 200 "$NAME"
            exit 1
          fi

      - name: Actually execute the binary - all 9 subcommands
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ matrix.os }}" = "windows-2025" ]; then
            BIN="forgemind-windows-x64.exe"
          else
            BIN="forgemind-${{ matrix.name }}"
            chmod +x "$BIN"
          fi
          RC=0
          run() {
            local label="$1"; shift
            if "./$BIN" "$@" > "out.$label.log" 2>&1; then
              echo "PASS $label"
            else
              echo "FAIL $label (exit $?)"
              tail -5 "out.$label.log"
              RC=1
            fi
          }
          run info            info
          run signal          signal
          run router-demo     router-demo
          run backtest        backtest --start 2024-01-01 --end 2024-12-31
          run agent           agent --yes --symbol 600519.SH --cash 100000 --position-qty 5 --position-price 1600
          run mcp             mcp
          run pick            pick --symbol 600519.SH
          # demo 用的是包内置的真实历史行情(取不到实时行情时的兜底)。
          # 二进制里能跑通 demo,顺带说明那份数据真被打进了构件里 ——
          # 少打一个文件,这个子命令就会当场找不到数据。
          run demo             demo --symbol 600519 --start 2024-01-01 --end 2024-12-31
          # etl 需要联网拉行情,失败是预期内;只要求它不要崩溃到无法退出
          if "./$BIN" etl --symbols 600519 > out.etl.log 2>&1; then
            echo "PASS etl(拉到数据)"
          else
            code=$?
            if grep -qE "0 条数据|未能安装|无数据|网络" out.etl.log; then
              echo "PASS etl(无数据时优雅降级, exit $code)"
            else
              echo "FAIL etl 崩溃: $(tail -2 out.etl.log)"
              RC=1
            fi
          fi
          # 下载用的资产名里带着哪个版本,构件报的版本就必须等于它 ——
          # 名字与内容对不上,用户拿到的就不是他以为的那一版。
          expected=$(cat .asset_version 2>/dev/null || echo "")
          actual=$(sed -n 's/.*Version:[[:space:]]*//p' out.info.log | tr -d '\r')
          if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
            echo "  PASS 构件版本与资产名里的版本一致($actual)"
          else
            echo "  FAIL 构件版本($actual)与资产名里的版本($expected)不一致"; RC=1
          fi
          echo "--- backtest 真实输出 ---"
          grep -E "Total Return|Sharpe|Max Drawdown|Trades" out.backtest.log || true
          echo "--- agent 是否落盘快照 ---"
          grep -iE "snapshot" out.agent.log || true
          exit $RC
