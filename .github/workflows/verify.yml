name: verify

# 真实验证:装完 wheel 后跑完整冒烟,并且**实际执行**三个平台二进制。
# 二进制跑不起来 = 直接判失败,不允许"构建成功"就算过。
#
# 需要的 secret: PRIVATE_REPO_TOKEN(与 ship.yml 相同)

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private source
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src && cd src
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "private source @ $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and install wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip build
          cd "$GITHUB_WORKSPACE/src"
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist" .
          python -m venv "$GITHUB_WORKSPACE/.v"
          "$GITHUB_WORKSPACE/.v/bin/pip" install -q --upgrade pip
          "$GITHUB_WORKSPACE/.v/bin/pip" install -q "$GITHUB_WORKSPACE"/dist/*.whl
          "$GITHUB_WORKSPACE/.v/bin/python" -c "import forgemind; print('import ok', forgemind.__version__)"

      - name: Sync the canonical verification script from private source
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # scripts/verify.py 是唯一的验证真源,CI 直接取用,
          # 避免"本地一套、CI 一套"两套标准各说各话
          mkdir -p src-scripts
          curl -sSL -H "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            "https://raw.githubusercontent.com/bin1732/forgemind/main/scripts/verify.py" \
            -o src-scripts/verify.py
          test -s src-scripts/verify.py || { echo "拉取 verify.py 失败"; exit 1; }
          echo "verify.py $(wc -c < src-scripts/verify.py) bytes"

      - name: Assert verify.py itself is lint-clean
        run: |
          pip install -q ruff
          ruff check --isolated --select E9,F63,F7,F82 "$GITHUB_WORKSPACE/src-scripts/verify.py"

      - name: Smoke - all CLI subcommands
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/.v/bin"
          for c in info signal router-demo; do
            "$V/forgemind" $c >/dev/null && echo "PASS forgemind $c" || { echo "FAIL forgemind $c"; exit 1; }
          done
          "$V/forgemind" backtest --start 2024-01-01 --end 2024-12-31 | grep -q "Total Return" \
            && echo "PASS backtest" || { echo "FAIL backtest"; exit 1; }
          # forgemind agent 现在是两步: prepare + 人工审批。
          # 非交互式 CI 用 --yes 自动批准;无 --yes 时会拒绝自动审批,
          # 那样才是正确的 gating 行为。
          out=$("$V/forgemind" agent --yes --symbol 600519.SH --cash 100000 --position-qty 5 --position-price 1600 2>/dev/null || true)
          echo "$out" | grep -q "snapshot saved" && echo "PASS agent(+snapshot)" \
            || { echo "FAIL agent: output=$out"; exit 1; }

      - name: Smoke - 12 strategies produce results
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/.v/bin"
          for s in ma_cross mean_reversion momentum bollinger buy_hold \
                   TimeSeriesMomentum CrossSectionalMomentum MomentumRotation \
                   OrnsteinUhlenbeck RSIReversion MaxSharpe RiskParity; do
            out=$("$V/forgemind" backtest --strategy "$s" --start 2024-01-01 --end 2024-12-31 2>&1)
            echo "$out" | grep -q "Total Return" \
              && echo "PASS $s" || { echo "FAIL $s: $(echo "$out" | tail -1)"; exit 1; }
          done

      - name: Smoke - portfolio strategies switch on multi-symbol data
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.v/bin/python" - <<'EOF'
          import numpy as np
          import pandas as pd
          from forgemind.core.strategies.extended_library import list_strategies
          rng = np.random.default_rng(7)
          rows = []
          for i in range(10):
              drift = rng.normal(0.0004, 0.001)
              c = 100 * np.exp(np.cumsum(rng.normal(drift, 0.015, 300)))
              for d, cl in zip(pd.date_range("2024-01-01", periods=300), c):
                  rows.append({"date": d, "symbol": f"S{i}", "close": cl})
          df = pd.DataFrame(rows)
          for name in ("MaxSharpe", "RiskParity", "CrossSectionalMomentum"):
              sig = list_strategies()[name](lookback=60).generate_signal(df)
              assert len(sig) == len(df), f"{name} 信号长度 {len(sig)} != {len(df)}"
              assert sig.sum() > 0, f"{name} 在多标的数据上无任何信号"
              print(f"PASS {name}: {int(sig.sum())} signals")
          EOF

      - name: Smoke - MCP tools, no fabricated data
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.v/bin/python" - <<'EOF'
          import asyncio
          import json
          from forgemind.mcp.server import ForgeMindMCPServer

          async def main():
              s = ForgeMindMCPServer()
              for name, args in [
                  ("search_features", {"query": "momentum"}),
                  ("get_feature", {"name": "kmid"}),
                  ("trace_feature_usage", {"feature_id": "KMID"}),
                  ("output_signal", {"symbol": "X", "side": "buy", "confidence": 0.8, "rationale": "t"}),
              ]:
                  r = await s.handle_request({
                      "jsonrpc": "2.0", "id": 1, "method": "tools/call",
                      "params": {"name": name, "arguments": args}})
                  assert "error" not in r, f"{name} 失败: {r.get('error')}"
                  print(f"PASS mcp/{name}")
              r = await s.handle_request({
                  "jsonrpc": "2.0", "id": 1, "method": "tools/call",
                  "params": {"name": "query_portfolio", "arguments": {}}})
              p = json.loads(r["result"]["content"][0]["text"])
              assert p.get("status") == "ok", f"query_portfolio 未读到快照: {p}"
              assert p["cash"] == 100000.0, f"cash 不对: {p['cash']}"
              assert p["positions"], "positions 为空"
              print(f"PASS mcp/query_portfolio 真实快照 cash={p['cash']} pos={p['positions']}")
          asyncio.run(main())
          EOF

      - name: Smoke - API endpoints and input validation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'from forgemind.api.main import app' \
            'import uvicorn' \
            'uvicorn.run(app, host="127.0.0.1", port=8095, log_level="error")' \
            > "$GITHUB_WORKSPACE/serve_verify.py"
          "$GITHUB_WORKSPACE/.v/bin/python" "$GITHUB_WORKSPACE/serve_verify.py" &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8095/health >/dev/null && break
            sleep 2
          done
          B=http://127.0.0.1:8095
          for ep in /health /api/v1/info /api/v1/health/services /mcp/tools/list; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$B$ep")
            [ "$code" = "200" ] && echo "PASS GET $ep" || { echo "FAIL GET $ep -> $code"; exit 1; }
          done
          for body in '{"start_date":"bad","end_date":"2024-06-01"}' \
                      '{"start_date":"2024-06-01","end_date":"2024-01-01"}' \
                      '{"start_date":"2024-01-01","end_date":"2024-06-01","fast_period":50,"slow_period":10}'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/v1/backtest/run" \
                   -H 'Content-Type: application/json' -d "$body")
            [ "$code" = "422" ] && echo "PASS 422" || { echo "FAIL expected 422 got $code for $body"; exit 1; }
          done
          R=$(curl -s "$B/api/v1/health/services")
          for leak in "127.0" "::1" "password" "Traceback" "site-packages"; do
            echo "$R" | grep -qi "$leak" && { echo "FAIL 泄露 $leak"; exit 1; } || echo "PASS 无泄露 $leak"
          done

  verify-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the released binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NAME="forgemind-windows-x64.exe"
          else
            NAME="forgemind-${{ matrix.name }}"
          fi
          # release 资产 URL 不变时会被 CDN 缓存,必须破坏缓存才能验到新版
          URL="https://github.com/bin1732/forgemind-pypi/releases/download/continuous/${NAME}?cb=${GITHUB_RUN_ID}"
          # ship.yml 为绕开"同名上传 422"会先删旧资产再上传同名资产,
          # 那个空窗期里下载会拿到 404 —— 而这里的 404 是**暂时性**的。
          # curl --retry 只重试 5xx/超时,遇 404 直接放弃;没有 --fail 时,
          # 404 的响应体("Not Found",9 字节)还会被当成内容写进文件,
          # 要到后面的大小检查才暴露。所以显式轮询 + --fail。
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sSLf --max-time 1800 -o "$NAME" "$URL" && [ -s "$NAME" ]; then
              ok=1; break
            fi
            echo "  尝试 $i/8 失败(资产可能正被 ship 替换),15s 后重试"
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "FAIL 下载失败(重试已耗尽)"; exit 1; fi
          SIZE=$(wc -c < "$NAME")
          echo "downloaded $NAME ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "FAIL: 文件过小($SIZE),很可能拿到的是错误页而不是二进制"
            head -c 200 "$NAME"
            exit 1
          fi

      - name: Actually execute the binary - all 8 subcommands
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="forgemind-windows-x64.exe"
          else
            BIN="forgemind-${{ matrix.name }}"
            chmod +x "$BIN"
          fi
          RC=0
          run() {
            local label="$1"; shift
            if "./$BIN" "$@" > "out.$label.log" 2>&1; then
              echo "PASS $label"
            else
              echo "FAIL $label (exit $?)"
              tail -5 "out.$label.log"
              RC=1
            fi
          }
          run info            info
          run signal          signal
          run router-demo     router-demo
          run backtest        backtest --start 2024-01-01 --end 2024-12-31
          run agent           agent --symbol 600519.SH --cash 100000 --position-qty 5 --position-price 1600
          run mcp             mcp
          run pick            pick --symbol 600519.SH
          # etl 需要联网拉行情,失败是预期内;只要求它不要崩溃到无法退出
          if "./$BIN" etl --symbols 600519 > out.etl.log 2>&1; then
            echo "PASS etl(拉到数据)"
          else
            code=$?
            if grep -qE "0 条数据|未能安装|无数据|网络" out.etl.log; then
              echo "PASS etl(无数据时优雅降级, exit $code)"
            else
              echo "FAIL etl 崩溃: $(tail -2 out.etl.log)"
              RC=1
            fi
          fi
          echo "--- backtest 真实输出 ---"
          grep -E "Total Return|Sharpe|Max Drawdown|Trades" out.backtest.log || true
          echo "--- agent 是否落盘快照 ---"
          grep -iE "snapshot" out.agent.log || true
          exit $RC
