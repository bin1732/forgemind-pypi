name: Release and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release body
        run: |
          cat > /tmp/release-body.md << 'BODY_EOF'
          # ForgeMind ${VERSION}

          See [CHANGELOG.md](https://github.com/bin1732/forgemind/blob/main/CHANGELOG.md) for details.

          ## Install
          ```
          pip install forgemind
          ```

          ## License
          Apache-2.0
          BODY_EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ForgeMind ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine --break-system-packages -q

      - name: Build
        run: python -m build

      - name: Upload to TestPyPI
        run: |
          twine upload --repository testpypi dist/*             --username __token__             --password '${{ secrets.PYPI_TOKEN }}'             --non-interactive

      - name: Verify package on TestPyPI
        run: |
          sleep 5
          curl -sf "https://test.pypi.org/pypi/forgemind/json" | python3 -c "
import sys, json
data = json.load(sys.stdin)
version = data['info']['version']
files = [f['filename'] for f in data['urls']]
print(f'✅ TestPyPI: forgemind {version}')
for f in files: print(f'   {f}')
"
