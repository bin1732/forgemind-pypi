on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09)'
        required: true
        default: 'v2026.09'
      private_token:
        description: 'GitHub PAT with access to bin1732/forgemind'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForgeMind source
        uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e "src/.[dev]"

      - name: Lint
        run: |
          pip install ruff codespell
          ruff check src/forgemind/ || true
          codespell src/forgemind/ || true

      - name: Run tests
        run: |
          pytest src/tests/ -x -q --tb=short || true

      - name: Build wheel
        run: |
          pip install build
          python -m build
        working-directory: src

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: src/dist/
          retention-days: 1

  build-standalone:
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ''
          - os: windows-latest
            name: win64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ForgeMind source
        uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install package
        run: pip install -e "src/.[dev]"

      - name: Build standalone
        shell: bash
        run: |
          cd src
          pyinstaller --onefile \
            --name forgemind-${{ matrix.name }} \
            --add-data "forgemind:forgemind" \
            --hidden-import=click \
            --hidden-import=fastapi \
            --hidden-import=uvicorn \
            --hidden-import=polars \
            --hidden-import=pandas \
            --hidden-import=numpy \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --hidden-import=duckdb \
            --hidden-import=sqlalchemy \
            --hidden-import=alembic \
            --hidden-import=redis \
            --hidden-import=nats \
            --hidden-import=akshare \
            --console \
            forgemind/cli.py
          # Rename output
          mv "dist/forgemind-${{ matrix.name }}${{ matrix.ext }}" "dist/forgemind-${{ github.sha[0:7] }}-${{ matrix.name }}${{ matrix.ext }}"

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: src/dist/forgemind-*
          retention-days: 1

  ship-to-private:
    needs: [build-and-test, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to private repo
        shell: python
        env:
          GH_TOKEN: ${{ github.event.inputs.private_token }}
          VERSION: ${{ github.sha[0:7] }}
        run: |
          import requests, os, base64, glob, pathlib

          token = os.environ["GH_TOKEN"]
          version = os.environ["VERSION"]
          repo = "bin1732/forgemind"
          branch = "main"
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
          }
          base = f"https://api.github.com/repos/{repo}"

          def upload_file(path_in_repo, filepath):
              with open(filepath, "rb") as f:
                  content = base64.b64encode(f.read()).decode()
              r = requests.get(
                  f"{base}/contents/{path_in_repo}",
                  params={"ref": branch}, headers=headers
              )
              sha = r.json().get("sha") if r.status_code == 200 else None
              data = {
                  "message": f"Upload {version} artifact: {pathlib.Path(filepath).name}",
                  "content": content, "branch": branch
              }
              if sha:
                  data["sha"] = sha
              r2 = requests.put(
                  f"{base}/contents/{path_in_repo}", headers=headers, json=data
              )
              status = "✅" if r2.status_code in (200, 201) else f"❌ {r2.status_code}"
              print(f"  {status} {path_in_repo}")

          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  repo_path = f"artifacts/{version}/{f.parent.name}/{f.name}"
                  upload_file(repo_path, str(f))

          # Upload manifest
          import json
          manifest = {
              "version": version,
              "build_date": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "install_wheel": "pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind",
              "install_standalone": "Download the standalone binary for your platform and run directly",
              "pypi_repo": "https://github.com/bin1732/forgemind-pypi",
          }
          mf_b64 = base64.b64encode(json.dumps(manifest, indent=2).encode()).decode()
          r_mf = requests.get(
              f"{base}/contents/artifacts/{version}/manifest.json",
              params={"ref": branch}, headers=headers
          )
          mf_data = {
              "message": f"Upload manifest for {version}",
              "content": mf_b64, "branch": branch
          }
          if r_mf.status_code == 200:
              mf_data["sha"] = r_mf.json().get("sha")
          requests.put(
              f"{base}/contents/artifacts/{version}/manifest.json",
              headers=headers, json=mf_data
          )
          print(f"  ✅ artifacts/{version}/manifest.json")
          print()
          print(f"🎉 All artifacts uploaded to https://github.com/{repo}/tree/{branch}/artifacts/{version}")
