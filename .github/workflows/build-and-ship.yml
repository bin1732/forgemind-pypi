on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v2026.09'
      private_token:
        description: 'GitHub PAT'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build
        working-directory: src

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: src/dist/
          retention-days: 1

  build-standalone:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            artifact_name: forgemind-linux-x86_64
          - os: windows-latest
            name: win64
            artifact_name: forgemind-win64.exe
          - os: macos-latest
            name: macos-arm64
            artifact_name: forgemind-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forgemind + all runtime deps via pyproject.toml
        shell: bash
        run: |
          # pip install from local source - reads pyproject.toml for deps
          # --no-deps would skip deps; we WANT them for PyInstaller to find
          pip install "src/.[dev,etl]" 2>&1 | tail -5 || \
          pip install "src/.[dev]" 2>&1 | tail -5
          # Verify pydantic is now importable
          python3 -c "import pydantic, fastapi, polars, duckdb; print('imports OK')"

      - name: Install PyInstaller
        shell: bash
        run: pip install pyinstaller

      - name: Build standalone via module entry-point
        shell: bash
        run: |
          # Resolve the actual installed forgemind.cli module path
          ENTRY=$(python3 -c "import forgemind.cli; print(forgemind.cli.__file__)")
          echo "Entry point: $ENTRY"

          # Determine paths argument (where forgemind package lives)
          PKG_PATH=$(python3 -c "import forgemind, os; print(os.path.dirname(forgemind.__file__))")
          echo "Package path: $PKG_PATH"

          mkdir -p out

          # Run PyInstaller. --collect-all forgemind bundles all submodules.
          # --collect-all on heavy deps ensures data files are included.
          pyinstaller --onefile --noconfirm --clean \
            --name ${{ matrix.artifact_name }} \
            --paths "$PKG_PATH" \
            --collect-all forgemind \
            --collect-all langchain \
            --collect-all langgraph \
            --collect-all langchain_core \
            --collect-all langchain_openai \
            --collect-all langchain_anthropic \
            --collect-all anthropic \
            --collect-all openai \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all polars \
            --collect-all duckdb \
            --collect-all sqlalchemy \
            --collect-all pydantic \
            --console \
            "$ENTRY"

          mv "dist/${{ matrix.artifact_name }}" out/
          ls -lh out/
          echo "--- Binary built ---"
          file out/* || true

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: out/
          retention-days: 1

  ship-to-private:
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to private repo
        env:
          GH_TOKEN: ${{ github.event.inputs.private_token }}
        run: |
          python3 << 'PYEOF'
          import requests, os, base64, pathlib, json, time
          from datetime import datetime
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          token = os.environ["GH_TOKEN"]
          repo = "bin1732/forgemind"
          h = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          base = f"https://api.github.com/repos/{repo}"

          # Configure retry on SSL/connection errors
          session = requests.Session()
          retry = Retry(total=5, backoff_factor=1, status_forcelist=[500, 502, 503, 504])
          adapter = HTTPAdapter(max_retries=retry)
          session.mount("https://", adapter)
          session.mount("http://", adapter)

          def upload_file(path_in_repo, filepath):
              with open(filepath, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode()
              r = session.get(f"{base}/contents/{path_in_repo}", params={"ref": "main"}, headers=h, timeout=30)
              data = {"message": f"Build artifact: {pathlib.Path(filepath).name}", "content": b64, "branch": "main"}
              if r.status_code == 200:
                  data["sha"] = r.json().get("sha")
              r2 = session.put(f"{base}/contents/{path_in_repo}", headers=h, json=data, timeout=60)
              icon = "[OK]" if r2.status_code in (200, 201) else f"[FAIL {r2.status_code}]"
              print(f"  {icon} {path_in_repo}")

          uploaded = []
          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  fname = f.name
                  if "linux" in fname or "ubuntu" in fname:
                      plat = "linux"
                  elif "win64" in fname:
                      plat = "windows"
                  elif "macos" in fname:
                      plat = "macos"
                  else:
                      plat = "source"
                  repo_path = f"artifacts/builds/{plat}/{fname}"
                  upload_file(repo_path, str(f))
                  uploaded.append(repo_path)

          manifest = {
              "version": "latest",
              "date": datetime.utcnow().isoformat() + "Z",
              "files": uploaded,
              "install_pypi": "pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind",
              "pypi_repo": "https://github.com/bin1732/forgemind-pypi",
          }
          mf_b64 = base64.b64encode(json.dumps(manifest, indent=2).encode()).decode()
          r_mf = requests.get(f"{base}/contents/artifacts/builds/manifest.json", params={"ref": "main"}, headers=h)
          mf_data = {"message": "Build manifest", "content": mf_b64, "branch": "main"}
          if r_mf.status_code == 200:
              mf_data["sha"] = r_mf.json().get("sha")
          requests.put(f"{base}/contents/artifacts/builds/manifest.json", headers=h, json=mf_data)
          print("  [OK] manifest.json")
          PYEOF
