on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09)'
        required: true
        default: 'v2026.09'
      private_token:
        description: 'GitHub PAT with access to bin1732/forgemind'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForgeMind source
        uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel (no install needed)
        run: |
          pip install build
          python -m build
        working-directory: src

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: src/dist/
          retention-days: 1

  build-standalone:
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: win64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ForgeMind source
        uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies only
        run: |
          pip install --no-build-isolation             fastapi uvicorn pydantic pydantic-settings             polars pandas numpy             click pyyaml             httpx aiohttp             sqlalchemy redis             duckdb             torch torchvision             transformers             pyinstaller

      - name: Build standalone
        shell: bash
        run: |
          pip install -e "src/"
          pyinstaller --onefile \
            --name forgemind-${{ matrix.name }} \
            --add-data "src/forgemind:forgemind" \
            --hidden-import=click,fastapi,uvicorn,polars,pandas,numpy,pydantic,pydantic_settings,duckdb,sqlalchemy,redis,httpx,aiohttp,yaml,torch,transformers \
            --console \
            src/forgemind/cli.py
          mkdir -p dist-out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "src/dist/forgemind-${{ matrix.name }}.exe" "dist-out/forgemind-${{ matrix.name }}-exe"
          else
            mv "src/dist/forgemind-${{ matrix.name }}" "dist-out/forgemind-${{ matrix.name }}"
            chmod +x "dist-out/forgemind-${{ matrix.name }}"
          fi

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: dist-out/
          retention-days: 1

  ship-to-private:
    needs: [build-and-test, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to private repo
        shell: python
        env:
          GH_TOKEN: ${{ github.event.inputs.private_token }}
        run: |
          import requests, os, base64, pathlib, json
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          repo = "bin1732/forgemind"
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
          }
          base = f"https://api.github.com/repos/{repo}"

          def upload(path, filepath):
              with open(filepath, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode()
              r = requests.get(f"{base}/contents/{path}", params={"ref": "main"}, headers=headers)
              data = {"message": f"Artifact: {pathlib.Path(filepath).name}", "content": b64, "branch": "main"}
              if r.status_code == 200:
                  data["sha"] = r.json().get("sha")
              r2 = requests.put(f"{base}/contents/{path}", headers=headers, json=data)
              icon = "✅" if r2.status_code in (200, 201) else f"❌ {r2.status_code}"
              print(f"  {icon} {path}")

          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  upload(f"artifacts/latest/{f.parent.name}/{f.name}", str(f))

          manifest = {
              "version": "latest",
              "date": datetime.utcnow().isoformat() + "Z",
              "install": "pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind",
              "pypi_repo": "https://github.com/bin1732/forgemind-pypi",
          }
          mf_b64 = base64.b64encode(json.dumps(manifest, indent=2).encode()).decode()
          r_mf = requests.get(f"{base}/contents/artifacts/latest/manifest.json",
                              params={"ref": "main"}, headers=headers)
          mf_data = {"message": "Upload manifest", "content": mf_b64, "branch": "main"}
          if r_mf.status_code == 200:
              mf_data["sha"] = r_mf.json().get("sha")
          requests.put(f"{base}/contents/artifacts/latest/manifest.json",
                       headers=headers, json=mf_data)
          print("  ✅ manifest.json")
          print()
          print("🎉 https://github.com/bin1732/forgemind/tree/main/artifacts/latest")
