on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v2026.09'
      private_token:
        description: 'GitHub PAT'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build
        working-directory: src

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: src/dist/
          retention-days: 1

  build-standalone:
    needs: build-wheel
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04  # GLIBC 2.35 for max compat
            name: linux-x86_64
            artifact_name: forgemind-linux-x86_64
          - os: windows-latest
            name: win64
            artifact_name: forgemind-win64.exe
          - os: macos-latest
            name: macos-arm64
            artifact_name: forgemind-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - shell: bash
        run: pip install pyinstaller

      - name: Build standalone (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind:forgemind" \
            --hidden-import=click,fastapi,uvicorn,polars,pandas,numpy,pydantic,pydantic_settings,duckdb,sqlalchemy,redis,httpx,aiohttp,yaml,akshare,langgraph,langchain \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/

      - name: Build standalone (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind;forgemind" \
            --hidden-import=click,fastapi,uvicorn,polars,pandas,numpy,pydantic,pydantic_settings,duckdb,sqlalchemy,redis,httpx,aiohttp,yaml,akshare,langgraph,langchain \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/

      - name: Build standalone (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind:forgemind" \
            --hidden-import=click,fastapi,uvicorn,polars,pandas,numpy,pydantic,pydantic_settings,duckdb,sqlalchemy,redis,httpx,aiohttp,yaml,akshare,langgraph,langchain \
            --target-arch arm64 \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: out/
          retention-days: 1

  ship-to-private:
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to private repo
        shell: python
        env:
          GH_TOKEN: ${{ github.event.inputs.private_token }}
        run: |
          import requests, os, base64, pathlib, json
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          repo = "bin1732/forgemind"
          h = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          base = f"https://api.github.com/repos/{repo}"

          def upload(path, filepath):
              with open(filepath, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode()
              r = requests.get(f"{base}/contents/{path}", params={"ref": "main"}, headers=h)
              data = {"message": f"Build artifact: {pathlib.Path(filepath).name}", "content": b64, "branch": "main"}
              if r.status_code == 200:
                  data["sha"] = r.json().get("sha")
              r2 = requests.put(f"{base}/contents/{path}", headers=h, json=data)
              icon = "✅" if r2.status_code in (200, 201) else f"❌ {r2.status_code}"
              print(f"  {icon} {path}")

          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  # Detect platform from filename
            fname = f.name
            if 'linux' in fname or 'ubuntu' in fname:
                plat = 'linux'
            elif 'win64' in fname or 'win' in fname:
                plat = 'windows'
            elif 'macos' in fname:
                plat = 'macos'
            else:
                plat = 'source'
            upload(f"artifacts/builds/{plat}/{fname}", str(f))

          manifest = {
              "version": "latest",
              "date": datetime.utcnow().isoformat() + "Z",
              "files": [],
              "install_pypi": "pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind",
              "pypi_repo": "https://github.com/bin1732/forgemind-pypi",
          }
          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  manifest["files"].append(str(f))
          mf_b64 = base64.b64encode(json.dumps(manifest, indent=2).encode()).decode()
          r_mf = requests.get(f"{base}/contents/artifacts/builds/manifest.json", params={"ref": "main"}, headers=h)
          mf_data = {"message": "Build manifest", "content": mf_b64, "branch": "main"}
          if r_mf.status_code == 200:
              mf_data["sha"] = r_mf.json().get("sha")
          requests.put(f"{base}/contents/artifacts/builds/manifest.json", headers=h, json=mf_data)
          print("  ✅ manifest.json")
          print()
          print("🎉 https://github.com/bin1732/forgemind/tree/main/artifacts/builds")
