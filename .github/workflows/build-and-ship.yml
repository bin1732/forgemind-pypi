on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: 'v2026.09'
      private_token:
        description: 'GitHub PAT'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build
        working-directory: src

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: src/dist/
          retention-days: 1

  build-standalone:
    needs: build-wheel
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04  # GLIBC 2.35 for max compat
            name: linux-x86_64
            artifact_name: forgemind-linux-x86_64
          - os: windows-latest
            name: win64
            artifact_name: forgemind-win64.exe
          - os: macos-latest
            name: macos-arm64
            artifact_name: forgemind-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies (for PyInstaller to bundle)
        shell: bash
        run: |
          pip install --no-build-isolation \
            fastapi uvicorn pydantic pydantic-settings polars duckdb \
            sqlalchemy alembic redis clickhouse-driver asyncpg python-multipart \
            structlog httpx aiohttp click pyyaml \
            openai anthropic "anthropic>=0.3,<1" \
            langchain langchain-core langchain-openai "langchain-anthropic>=0.3,<1" \
            langgraph "scipy>=1.10" pandas numpy akshare

      - name: Install PyInstaller
        shell: bash
        run: pip install pyinstaller

      - name: Build standalone (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile --noconfirm \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind:forgemind" \
            --collect-all langchain \
            --collect-all langgraph \
            --collect-all langchain_core \
            --collect-all langchain_openai \
            --collect-all langchain_anthropic \
            --collect-all anthropic \
            --collect-all openai \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all polars \
            --collect-all duckdb \
            --collect-all sqlalchemy \
            --collect-all akshare \
            --collect-submodules forgemind \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/
          ls -lh out/

      - name: Build standalone (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile --noconfirm \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind;forgemind" \
            --collect-all langchain \
            --collect-all langgraph \
            --collect-all langchain_core \
            --collect-all langchain_openai \
            --collect-all langchain_anthropic \
            --collect-all anthropic \
            --collect-all openai \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all polars \
            --collect-all duckdb \
            --collect-all sqlalchemy \
            --collect-all akshare \
            --collect-submodules forgemind \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/
          ls -lh out/

      - name: Build standalone (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p out
          pyinstaller --onefile --noconfirm \
            --name ${{ matrix.artifact_name }} \
            --paths src \
            --add-data "src/forgemind:forgemind" \
            --collect-all langchain \
            --collect-all langgraph \
            --collect-all langchain_core \
            --collect-all langchain_openai \
            --collect-all langchain_anthropic \
            --collect-all anthropic \
            --collect-all openai \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all polars \
            --collect-all duckdb \
            --collect-all sqlalchemy \
            --collect-all akshare \
            --collect-submodules forgemind \
            --target-arch arm64 \
            --console \
            src/forgemind/cli.py
          mv dist/${{ matrix.artifact_name }} out/
          ls -lh out/

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: out/
          retention-days: 1

  ship-to-private:
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bin1732/forgemind
          ref: main
          token: ${{ github.event.inputs.private_token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to private repo
        env:
          GH_TOKEN: ${{ github.event.inputs.private_token }}
        run: |
          python3 << 'PYEOF'
          import requests, os, base64, pathlib, json
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          repo = "bin1732/forgemind"
          h = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          base = f"https://api.github.com/repos/{repo}"

          def upload_file(path_in_repo, filepath):
              with open(filepath, "rb") as f:
                  b64 = base64.b64encode(f.read()).decode()
              r = requests.get(f"{base}/contents/{path_in_repo}", params={"ref": "main"}, headers=h)
              data = {"message": f"Build artifact: {pathlib.Path(filepath).name}", "content": b64, "branch": "main"}
              if r.status_code == 200:
                  data["sha"] = r.json().get("sha")
              r2 = requests.put(f"{base}/contents/{path_in_repo}", headers=h, json=data)
              icon = "✅" if r2.status_code in (200, 201) else f"❌ {r2.status_code}"
              print(f"  {icon} {path_in_repo}")

          uploaded = []
          for f in pathlib.Path("artifacts").rglob("*"):
              if f.is_file():
                  fname = f.name
                  if "linux" in fname or "ubuntu" in fname:
                      plat = "linux"
                  elif "win64" in fname:
                      plat = "windows"
                  elif "macos" in fname:
                      plat = "macos"
                  else:
                      plat = "source"
                  repo_path = f"artifacts/builds/{plat}/{fname}"
                  upload_file(repo_path, str(f))
                  uploaded.append(repo_path)

          manifest = {
              "version": "latest",
              "date": datetime.utcnow().isoformat() + "Z",
              "files": uploaded,
              "install_pypi": "pip install --extra-index-url https://bin1732.github.io/forgemind-pypi/pypi/simple/forgemind/ forgemind",
              "pypi_repo": "https://github.com/bin1732/forgemind-pypi",
          }
          mf_b64 = base64.b64encode(json.dumps(manifest, indent=2).encode()).decode()
          r_mf = requests.get(f"{base}/contents/artifacts/builds/manifest.json", params={"ref": "main"}, headers=h)
          mf_data = {"message": "Build manifest", "content": mf_b64, "branch": "main"}
          if r_mf.status_code == 200:
              mf_data["sha"] = r_mf.json().get("sha")
          requests.put(f"{base}/contents/artifacts/builds/manifest.json", headers=h, json=mf_data)
          print("  ✅ manifest.json")
          print()
          print("All artifacts uploaded.")
          PYEOF
