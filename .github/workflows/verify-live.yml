name: verify-live

# 沙箱验不到、只能在这里验的部分:
#   1. akShare 真实上游取数(沙箱网络到不了,CI runner 有网)
#   2. 端到端数据链路:真实 K 线 → 选股 → MCP stock_pick
#   3. 真实行情下的因子/IC 数值合理性
#
# 这类测试在本地跑会红(网络),必须放在有网的环境。
# 因此它与 verify3 的三视角互补:三视角覆盖"能离线验的",这里覆盖"必须联网的"。

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# 新的发布会把还在跑的验证顶掉。被顶掉的那次记成 cancelled
# (而不是 failure)—— 它验的是已经被取代的构件,红在那里只会误导人。
concurrency:
  # 三个发布后验证各用各的并发组,互不干涉。
  #
  # 曾经把三个放进同一个组里串行跑,理由是"同一时刻只有一个要 macOS"。
  # 那个设计是反的:GitHub 的并发组只保留**一个**排队中的运行,新运行
  # 进来时先到的那个排队中的会被取消掉 —— 于是每次发布必然有两个验证
  # 被取消,谁活下来取决于谁先排到队,对外是随机结果。
  #
  # 实测(2026-11-04,同一批发布):verify-live 与 wheel-suite 是 success,
  # verify 与 verify-desktop 是 cancelled;换一批提交,被取消的换成另外
  # 两个。被取消的那几次,工作流停在 jobs=0 —— 作业压根没被创建,不是
  # 作业跑了失败。
  #
  # 现在各用各的组:新的一次发布只顶掉**同一个**工作流上一次还在跑的
  # 验证(它验的是已被取代的构件),不同工作流之间不会互相取消。
  group: verify-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-akshare:
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复,而且还要白烧一轮 macOS 配额。
    # 手动触发(w workflow_dispatch)没有上游发布,照跑。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-26.04
    steps:
      - name: 检出公开仓
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 读出构件来源提交
        id: source
        uses: ./.github/actions/resolve-source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install with CN extras
        working-directory: .
        run: |
          python -m pip install -q --break-system-packages --upgrade pip
          python -m pip install -q --break-system-packages ".[cn]"

      - name: Live akshare fetch - real upstream
        shell: bash
        run: |
          set -uo pipefail
          # 探针只有一份:本仓的 scripts/live_probe.py。这里以前内嵌了一份
          # base64 副本 —— 改文件不改编本,于是有一阵子 CI 跑的还是旧副本,
          # 新加的检查根本没被执行过。
          code=0
          python scripts/live_probe.py > live_akshare.log 2>&1 || code=$?
          echo "--- live_akshare.log ---"
          cat live_akshare.log
          echo "--- (exit=$code) ---"
          if [ "$code" != "0" ]; then
            echo "FAIL: 真实上游取数未通过 (rc=$code)"
            exit 1
          fi
          # 每一段都要有自己的 PASS 行。只查"有没有 PASS 行"的话,探针在
          # 第一段之后就崩了,门禁照样是绿的 —— 后面的检查根本没跑到。
          for marker in "PASS akshare real fetch" "PASS end-to-end real data"; do
            grep -q "^$marker" live_akshare.log || { echo "FAIL: 缺少 $marker"; exit 1; }
          done
          # 宏观要么真取到了,要么明确说了取不到的理由。两样都没有就是
          # 探针没跑到那一段 —— 那不能算通过。
          if grep -q "^PASS macro real fetch" live_akshare.log; then
            echo "PASS 宏观数据真取到了"
          elif grep -q "^SKIP macro:" live_akshare.log; then
            grep "^SKIP macro:" live_akshare.log
            echo "WARN: 本次运行环境取不到宏观数据(理由见上)"
          else
            echo "FAIL: 宏观那一段没有执行到"
            exit 1
          fi

      - name: CLI etl on live upstream
        run: |
          set -uo pipefail
          rm -rf data
          forgemind etl --symbols 600519,000001 > etl.log 2>&1 || true
          tail -20 etl.log
          # 0 条时应 exit 1 并给出可行动的分类;有条时应报成功
          if grep -q "ETL complete" etl.log; then
            echo "PASS CLI etl 从真实上游取到数据"
          elif grep -qE "失败原因分类|akshare" etl.log; then
            echo "PASS CLI etl 优雅降级并给出可行动分类(上游暂时不可用)"
          else
            echo "FAIL: CLI etl 既没成功也没给出分类"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-akshare-logs
          path: |
            live_akshare.log
            live_pick.log
            etl.log
          if-no-files-found: ignore
          retention-days: 7
