name: verify-desktop

# Tauri 桌面端的真实编译验证。
# 沙箱缺 GTK/WebKit 系统库,只有 CI runner 能真正 cargo check / build。
# 源码同样来自私人仓。

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-desktop.yml"

permissions:
  contents: read

jobs:
  check-rust:
    name: cargo check (lib.rs)
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch private source
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "private source @ $(git rev-parse --short HEAD)"

      - name: Install Tauri system dependencies
        run: |
          # 注意:注释不能放在反斜杠续行中间,否则 shell 会把下一行当命令执行
          # libappindicator3-dev 与 libayatana-appindicator3-dev 在 ubuntu-22.04 互斥
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forgemind-ui/src-tauri

      - name: cargo check
        working-directory: forgemind-ui/src-tauri
        run: cargo check --message-format=short

      - name: cargo test
        working-directory: forgemind-ui/src-tauri
        run: cargo test --no-run --message-format=short

  build-desktop-bundle:
    name: tauri bundle (ubuntu)
    needs: check-rust
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch private source
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri system dependencies
        run: |
          # 注意:注释不能放在反斜杠续行中间,否则 shell 会把下一行当命令执行
          # libappindicator3-dev 与 libayatana-appindicator3-dev 在 ubuntu-22.04 互斥
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forgemind-ui/src-tauri

      - name: Install web deps
        working-directory: forgemind-ui
        run: |
          npm install --no-audit --no-fund --registry=https://registry.npmjs.org
          npx tsc --noEmit
          npm test --silent

      - name: Build Next.js
        working-directory: forgemind-ui
        run: npx next build

      - name: cargo build (desktop binary)
        working-directory: forgemind-ui/src-tauri
        run: cargo build --release --message-format=short

      - name: Show artifact
        working-directory: forgemind-ui/src-tauri
        run: |
          ls -lh target/release/forgemind-desktop || true
          file target/release/forgemind-desktop || true

      - name: Install Xvfb for headless run
        run: sudo apt-get install -y -qq xvfb

      - name: Actually run the desktop app under Xvfb
        run: |
          set -uo pipefail
          BIN=forgemind-ui/src-tauri/target/release/forgemind-desktop
          # 前 25 秒算存活:无 DISPLAY 时 Tauri 会在初始化阶段直接退出
          # GitHub 的默认 shell 已带 -e,`timeout` 返回 124(存活超时)会直接终止脚本,
          # 所以必须用 `|| code=$?` 把失败显式吃掉。
          code=0
          timeout 25 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            "$PWD/$BIN" > app.log 2>&1 || code=$?
          echo "exit code: $code"
          tail -25 app.log
          if grep -qiE "cannot open display|failed to.*gtk|panicked" app.log; then
            echo "FAIL: 桌面应用无法初始化图形后端"
            exit 1
          fi
          # 124 = timeout 杀死 = 应用一直存活,这是 headless 下的成功信号
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "FAIL: 应用在 25 秒内异常退出 ($code)"
            exit 1
          fi
          echo "PASS 桌面应用在虚拟显示下存活 25 秒"

      - uses: actions/upload-artifact@v4
        with:
          name: forgemind-desktop-linux
          path: forgemind-ui/src-tauri/target/release/forgemind-desktop
          if-no-files-found: error
