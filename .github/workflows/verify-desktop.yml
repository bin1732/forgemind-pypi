name: verify-desktop

# Tauri 桌面端的真实编译验证。
# 沙箱缺 GTK/WebKit 系统库,只有 CI runner 能真正 cargo check / build。
# 源码同样来自私人仓。

on:
  workflow_run:
    workflows: ["ship"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-desktop.yml"

permissions:
  contents: read

jobs:
  check-rust:
    name: cargo check (lib.rs)
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch private source
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD
          echo "private source @ $(git rev-parse --short HEAD)"

      - name: Install Tauri system dependencies
        run: |
          # 注意:注释不能放在反斜杠续行中间,否则 shell 会把下一行当命令执行
          # libappindicator3-dev 与 libayatana-appindicator3-dev 在 ubuntu-22.04 互斥
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forgemind-ui/src-tauri

      - name: cargo check
        working-directory: forgemind-ui/src-tauri
        run: cargo check --message-format=short

      - name: cargo test (unit tests of the command logic)
        working-directory: forgemind-ui/src-tauri
        run: cargo test --lib --message-format=short

      - name: Show test results
        working-directory: forgemind-ui/src-tauri
        run: |
          grep -E "^test result|running [0-9]+ test" -A 1 || true

  build-desktop:
    needs: check-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundler: deb
          - os: macos-14
            name: macos
            bundler: dmg
          - os: windows-latest
            name: windows
            bundler: msi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch private source
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/bin1732/forgemind.git"
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # libappindicator3-dev 与 libayatana-appindicator3-dev 在 ubuntu-22.04 互斥
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev xvfb

      - name: Install Tauri system dependencies (macOS)
        if: runner.os == 'macOS'
        run: echo "macOS runner 已预装 WebKit,无需额外系统依赖"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forgemind-ui/src-tauri

      - name: Assert lockfile matches package.json
        working-directory: forgemind-ui
        shell: bash
        run: |
          set -euo pipefail
          # 曾出现 package.json 写 next=15.0.3 而 lockfile 是 15.5.26 的情况:
          # 两份文件在不同的副本里各改了一半。CI 照 package.json 解析,
          # 撞上 React 19 的 peer 冲突(ERESOLVE),报错信息完全看不出根因。
          node -e '
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const want = pkg.dependencies;
            const got = {};
            for (const [k, v] of Object.entries(lock.packages)) {
              if (k.includes("node_modules/") && v && v.version) {
                got[k.split("node_modules/").pop()] = v.version;
              }
            }
            let bad = 0;
            for (const [n, range] of Object.entries(want)) {
              const v = got[n];
              if (!v) continue;
              if (range.startsWith("^")) {
                const major = range.slice(1).split(".")[0];
                if (!v.startsWith(major + ".")) {
                  console.log("MISMATCH " + n + ": package.json " + range + " vs lock " + v);
                  bad++;
                }
              } else if (v !== range) {
                console.log("MISMATCH " + n + ": package.json " + range + " vs lock " + v);
                bad++;
              }
            }
            if (bad) { console.error(bad + " 个依赖在 package.json 与 lockfile 间不一致"); process.exit(1); }
            console.log("package.json 与 lockfile 一致");
          '

      - name: Install web deps
        working-directory: forgemind-ui
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npx tsc --noEmit
          npm test --silent

      - name: Build Next.js
        working-directory: forgemind-ui
        run: npx next build

      - name: Download the RELEASED binary (what users actually get)
        shell: bash
        run: |
          set -uo pipefail
          # 这一步刻意下载**已发布**的二进制,而不是本地 cargo build 出来的。
          # 二者可能不同:发布物可能陈旧、被 CDN 缓存、或与当前源码不一致 ——
          # 而用户拿到的永远是发布物。本地构建通过 ≠ 用户能跑。
          if [ "${{ runner.os }}" = "Windows" ]; then
            NAME="forgemind-windows-x64.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            NAME="forgemind-macos"
          else
            NAME="forgemind-linux"
          fi
          mkdir -p released
          code=0
          curl -sSL --retry 3 --max-time 1800 \
            -o "released/$NAME" \
            "https://github.com/bin1732/forgemind-pypi/releases/download/continuous/$NAME" || code=$?
          if [ "$code" != "0" ] || [ ! -s "released/$NAME" ]; then
            echo "FAIL: 无法下载发布物 $NAME (curl=$code)"
            exit 1
          fi
          ls -lh "released/$NAME"
          file "released/$NAME" 2>/dev/null || true

      - name: Run the RELEASED binary (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          BIN=released/forgemind-linux
          chmod +x "$BIN"
          code=0
          timeout 30 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            "$PWD/$BIN" info > rel_info.log 2>&1 || code=$?
          cat rel_info.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "FAIL: 发布物 info 退出码 $code"
            exit 1
          fi
          grep -q "ForgeMind Config" rel_info.log || { echo "FAIL: 发布物无正常输出"; exit 1; }
          echo "PASS 发布物(info)可在真实用户环境运行"

      - name: Run the RELEASED binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          BIN=released/forgemind-macos
          chmod +x "$BIN"
          code=0
          timeout 30 "$PWD/$BIN" info > rel_info.log 2>&1 || code=$?
          cat rel_info.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "FAIL: 发布物 info 退出码 $code"; exit 1
          fi
          grep -q "ForgeMind Config" rel_info.log || { echo "FAIL: 发布物无正常输出"; exit 1; }
          echo "PASS 发布物(macOS info)可运行"

      - name: Run the RELEASED binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          BIN=released/forgemind-windows-x64.exe
          code=0
          "./$BIN" info > rel_info.log 2>&1 || code=$?
          cat rel_info.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "FAIL: 发布物 info 退出码 $code"; exit 1
          fi
          grep -q "ForgeMind Config" rel_info.log || { echo "FAIL: 发布物无正常输出"; exit 1; }
          echo "PASS 发布物(Windows info)可运行"

      - name: cargo build (desktop binary)
        working-directory: forgemind-ui/src-tauri
        run: cargo build --release --message-format=short

      - name: Show artifact
        working-directory: forgemind-ui/src-tauri
        shell: bash
        run: |
          ls -lh target/release/forgemind-desktop* 2>/dev/null || true

      - name: Actually run the desktop app (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          BIN=forgemind-ui/src-tauri/target/release/forgemind-desktop
          # GitHub 默认 shell 已带 -e,timeout 返回 124(存活超时)会终止脚本,
          # 必须用 || code=$? 吃掉
          code=0
          timeout 30 xvfb-run -a --server-args="-screen 0 1280x900x24" \
            "$PWD/$BIN" > app.log 2>&1 || code=$?
          echo "exit code: $code"
          tail -20 app.log
          if grep -qiE "cannot open display|failed to.*gtk|panicked" app.log; then
            echo "FAIL: 桌面应用无法初始化图形后端"
            exit 1
          fi
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "FAIL: 应用在 30 秒内异常退出 ($code)"
            exit 1
          fi
          echo "PASS 桌面应用(Linux)在虚拟显示下存活 30 秒"

      - name: Actually run the desktop app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          BIN=forgemind-ui/src-tauri/target/release/forgemind-desktop
          # macOS 没有 GNU coreutils 的 timeout 命令,这里用后台进程 + sleep + kill
          code=0
          "$PWD/$BIN" > app.log 2>&1 &
          pid=$!
          ( sleep 30; kill -0 "$pid" 2>/dev/null && kill -TERM "$pid" 2>/dev/null ) &
          watchdog=$!
          wait "$pid" || code=$?
          kill "$watchdog" 2>/dev/null || true
          # 124 = 被超时杀掉 = 应用一直存活,这正是我们要的信号
          [ "$code" = "143" ] && code=124
          echo "exit code: $code"
          tail -25 app.log
          if grep -qiE "failed to open display|NSApplication|CGSWindow|could not connect" app.log; then
            echo "NOTE: 无图形会话(headless runner),以下仅确认二进制可加载"
            # 至少要证明二进制本身能执行到主入口而不是立即崩溃
            if [ "$code" -ne 124 ] && [ "$code" -ne 0 ] && ! grep -qi "application" app.log; then
              echo "FAIL: 二进制无法启动"
              exit 1
            fi
            echo "PASS macOS 二进制可加载(无显示会话,窗口创建未验证)"
          elif [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "FAIL: 应用在 30 秒内异常退出 ($code)"
            exit 1
          else
            echo "PASS 桌面应用(macOS)存活 30 秒"
          fi

      - name: Actually run the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          # Git Bash 会吞掉反斜杠路径,统一用正斜杠
          BIN=./forgemind-ui/src-tauri/target/release/forgemind-desktop.exe
          # Windows 的 timeout 是 cmd 的 sleep,语义不同;这里用 PowerShell 无关的
          # 后台 + 轮询方式,不依赖 coreutils
          code=0
          "$BIN" > app.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            code=124
          else
            wait "$pid" || code=$?
          fi
          echo "exit code: $code"
          tail -25 app.log
          # Windows runner 无交互式桌面,但进程能跑起来就证明
          # 打包产物、依赖、入口都正常
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "FAIL: 应用在 30 秒内异常退出 ($code)"
            exit 1
          fi
          echo "PASS 桌面应用(Windows)存活 30 秒"

      - uses: actions/upload-artifact@v4
        with:
          name: forgemind-desktop-${{ matrix.name }}
          path: |
            forgemind-ui/src-tauri/target/release/forgemind-desktop
            forgemind-ui/src-tauri/target/release/forgemind-desktop.exe
          if-no-files-found: error
          retention-days: 7
