name: ForgeMind CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 最小权限原则: OIDC 云资源访问用 read-only
permissions:
  contents: read

jobs:
  # ============================================================
  # 安全扫描 (依赖漏洞 + secrets)
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (core only, for pip-audit scan)
        run: |
          pip install --upgrade pip
          # 仅核心运行时依赖，排除需要编译的 opt deps
          pip install --no-cache-dir \
            fastapi uvicorn pydantic pydantic-settings \
            polars duckdb clickhouse-driver asyncpg sqlalchemy \
            redis nats-py \
            pandas numpy scikit-learn \
            lightgbm xgboost \
            httpx tenacity structlog \
            langchain-core langgraph \
            akshare

      # pip-audit: 检测依赖 CVE (高危及以上)
      - name: pip-audit 依赖漏洞扫描
        uses: pypa/pip-audit-action@v1
        with:
          vulnerability: high,critical
          # allow 暂不填，后续由安全研究员逐条审计已知漏洞后加进来

      # detect-secrets: 扫描新增的硬编码凭证
      - name: detect-secrets scan
        run: |
          pip install detect-secrets --break-system-packages -q
          detect-secrets scan --baseline .secrets.baseline .
          # baseline 外的新 secrets → 非零退出码
          detect-secrets scan --baseline .secrets.baseline --fail-on-unaudited .

  # ============================================================
  # Python 测试 (Linux)
  # ============================================================
  test-python:
    name: Python 测试 (Linux)
    runs-on: ubuntu-latest
    needs: security
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system deps (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir pydantic pydantic-settings polars pyarrow duckdb \
            numpy pandas scipy scikit-learn requests httpx structlog \
            tenacity langchain langgraph fastapi uvicorn \
            lightgbm xgboost pytest pytest-asyncio pytest-cov coverage \
            akshare vulture
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests + Coverage
        env:
          FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        run: |
          coverage run --source=forgemind -m pytest tests/ \
            -k "not Benchmark and not test_phase11_mega" \
            --tb=short -q
          # 覆盖率 >= 80%，与 CONTRIBUTING.md 一致
          coverage report --skip-empty --fail-under=80
      
      - name: Vulture dead code scan
        run: |
          pip install vulture --break-system-packages -q
          python -m vulture forgemind/ tests/ --min-confidence 90 || true
          echo "Vulture scan complete (warnings allowed, see report)"
      
      - name: Mega benchmark (nightly only)
        if: github.event.schedule
        env:
          FORGEMIND_API_SECRET_KEY: ${{ secrets.FORGEMIND_API_SECRET_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
        run: |
          python -m pytest tests/test_end_to_end.py::TestBenchmark::test_mega_scale_benchmark \
            -v -s --tb=short
        continue-on-error: true
  
  test-ui:
    name: UI 测试 (Next.js + Jest)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./forgemind-ui
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: forgemind-ui/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit
      
      - name: TypeScript type check
        run: npm run type-check
      
      - name: Build
        run: npm run build
      
      - name: Run Jest tests
        run: ./node_modules/.bin/jest
  
  test-go-sdk:
    name: Go SDK Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go SDK
        run: |
          cd sdks/go/forgemind
          go mod tidy
          go build ./...

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Ruff (formatter + linter) — 5s 内完成，等效于 black+isort+pyflakes
      - name: Install Ruff
        run: pip install ruff codespell --break-system-packages -q

      - name: Ruff check (lint)
        run: ruff check forgemind/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check forgemind/ tests/ --output-format=github

      - name: Codespell
        run: codespell forgemind/ --ignore-words=.codespellignore --output-format=github

      - name: Vulture dead code scan
        run: |
          pip install vulture --break-system-packages -q
          python -m vulture forgemind/ tests/ --min-confidence 100 || true
          echo "Vulture max-confidence scan done"

      - name: Core imports check
        run: |
          python -c "
from forgemind.core.ai.providers import create_provider, ProviderType
from forgemind.mcp.server import ForgeMindMCPServer
from forgemind.core.backtest.engine import SimpleBacktestEngine
print('All core imports OK')
"