name: heavy-full

# 重并发档的**完整规模**,单独一条流水线。
#
# 它要占满整台机器的内存与 CPU:抽样那一档(一百多个用例)可以和别的
# 作业并发,完整规模(一千八百多个)不行 —— 同一时间再跑常规档与抽样档,
# 机器被抢满,用例开始超时,跑出来的结果也不再代表"完整规模在正常机器
# 上的表现"。
#
# 所以它自己一条流水线,定时与手动触发。

on:
  workflow_dispatch:
  schedule:
  # 一天两个时段:这一档要跑近一小时,错过一个时段就少一次验证。
  - cron: '41 3 * * *'
  - cron: '41 15 * * *'

permissions:
  contents: read

jobs:
  heavy-full:
    name: 重并发测试 (完整规模)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v7
    - name: 读出构件来源提交
      id: source
      uses: ./.github/actions/resolve-source
    # 被测的必须是**发布出去的那一份源码**:清单里记着构件是从哪个提交
    # 做出来的,拿当前分支的头去测它,测的就不是用户装到手上的那份。
    # 完整历史是必需的 —— 有用例要翻 git 历史。
    - name: 检出被测的提交
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.source.outputs.commit }}
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
        pip install --break-system-packages --no-cache-dir --prefer-binary --no-deps -e . 2>&1 | tee -a /tmp/pip-all.log || true
    - name: 重并发测试(完整规模)
      env:
        # 关掉按文件分组的抽样。这个值是**除数**:抽样时每个文件留
        # len//ratio 个,至少一个 —— 10 是"留十分之一",1 才是"全留"。
        FORGEMIND_HEAVY_SAMPLE_RATIO: "1"
      run: |
        # 单用例 timeout 3600s:完整规模里有跑十几分钟的用例,
        # 900s 的上限会误杀它们。
        python -m pytest tests/ \
          -m heavy \
          --tb=short -q \
          --timeout=3600
