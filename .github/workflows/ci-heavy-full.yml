name: heavy-full

# 重并发档的**完整规模**,单独一条流水线。
#
# 它要占满整台机器的内存与 CPU:抽样那一档(一百多个用例)可以和别的
# 作业并发,完整规模(一千八百多个)不行 —— 同一时间再跑常规档与抽样档,
# 机器被抢满,用例开始超时,跑出来的结果也不再代表"完整规模在正常机器
# 上的表现"。
#
# 所以它自己一条流水线,定时与手动触发。

on:
  workflow_dispatch:
  schedule:
  # 一天两个时段:这一档要跑近一小时,错过一个时段就少一次验证。
  - cron: '41 3 * * *'
  - cron: '41 15 * * *'

permissions:
  contents: read

jobs:
  heavy-full:
    name: 重并发测试 (完整规模)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .
    steps:
    - name: 检出公开仓
      uses: actions/checkout@v7
      with:
        ref: main
    - name: 读出构件来源提交
      id: source
      uses: ./.github/actions/resolve-source
