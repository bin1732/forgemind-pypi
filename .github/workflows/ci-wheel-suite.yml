name: 全量测试跑在发布出去的 wheel 上

# 这一档是"同一份代码的两条独立路径"的第二条:
# 第一条在源码树上跑,这一条在**用户真正装到手上的那个 wheel** 上跑。
#
# 差别不是形式:源码树里有的模块,构建配置漏掉一个子包,用户装上之后
# import 就报错 —— 源码树里那个模块明明在,第一条路径也全绿。
#
# 为什么挂在发布之后跑:被测的构件必须与被测的测试同代。发布要十几
# 分钟,而测试若在 push 后立刻起,拿到的会是上一代的 wheel —— 红的是
# "版本对不上",不是构件坏了,那样的红没有意义。
#
# 被测的那份提交,一律取**清单里记的 source_commit** —— 清单记的就是
# 线上那份构件是从哪个提交做出来的,那是唯一说得清的"用户装到手上的
# 那一份"。两种触发各核对各的:
#
# - 挂在发布之后跑:清单里的提交必须就是这次发布的提交。对不上说明
#   线上那份与这一档要测的不是同一份东西,报错。
# - 定时/手动跑:线上那份是最近一次发布做出来的,测的就得是**做它的那份
#   源码**,不是当前分支的头 —— 拿分支头去测上一代的构件,测的就不是
#   用户装到手上的那份。同时要确认那个提交确实在本仓历史里:清单里
#   写个 sha 就算数的话,这条检查等于没有。
#
# 对不上就报错:用户下载到的与被测的不是同一份,这是值得报的事,不是
# 可以放过去的事。

on:
  workflow_run:
    workflows:
    - ship
    types:
    - completed
  workflow_dispatch: null
  schedule:
  - cron: '43 4 * * *'

permissions:
  contents: read

concurrency:
  group: wheel-suite-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  wheel-suite:
    name: 全量测试跑在发布出去的 wheel 上
    runs-on: ubuntu-26.04
    # 发布没成功就没有"发布出去的构件"可验 —— 失败已经由发布那一档报过了,
    # 这里再报一遍是重复。手动触发(w workflow_dispatch)没有上游发布,照跑。
    # 发布面的验证只在发布面那个仓里跑:镜像仓不发布,验的其实是公开仓
    # 发出去的那一份,拿镜像仓的提交去对公开仓的清单必然对不上(假红);
    # 多平台那档还会在镜像里重复烧一遍配额。理由详见 ship.yml。
    if: github.repository == 'bin1732/forgemind-pypi' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
    # 先检出一份,是为了拿到仓里那个读清单的本地 action(action 是从工作区
    # 读的,没有检出就没有它)。真正被测的提交在下一步确定后会再检一次。
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: 读出线上清单
      id: source
      uses: ./.github/actions/resolve-source
    - name: 核对被测的提交
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        # 清单记的:线上那份构件是从哪个提交做出来的。
        PUBLISHED_COMMIT: ${{ steps.source.outputs.commit }}
        # 这次发布本身的提交。只有挂在发布之后跑时才有值。
        TRIGGER_COMMIT: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        echo "清单里的源码提交: $PUBLISHED_COMMIT"
        echo "这次发布的提交: ${TRIGGER_COMMIT:-(非发布触发)}"
        if [ -n "$TRIGGER_COMMIT" ]; then
          # 挂在发布之后跑:被测的就该是这一次发布做出来的那一份。
          if [ "$PUBLISHED_COMMIT" != "$TRIGGER_COMMIT" ]; then
            echo "FAIL: 线上清单记的提交($PUBLISHED_COMMIT)不是这次发布的提交($TRIGGER_COMMIT)"
            echo "      用户下载到的与这一档要测的不是同一份东西"
            exit 1
          fi
          echo "被测提交 = 这次发布的提交 ✓"
        else
          # 定时/手动跑:线上那份构件是最近一次发布做出来的,要测的必须是
          # 做它的那份源码,不是当前分支的头 —— 拿分支头去测上一代的构件,
          # 测的就不是用户装到手上的那份。
          #
          # 还要确认这个提交确实在本仓历史里:清单里写个 sha 就算数的话,
          # 那条检查等于没有。
          status=$(curl -sS --max-time 60 --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/compare/main...$PUBLISHED_COMMIT" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',''))")
          case "$status" in
            behind|identical)
              echo "被测提交 $PUBLISHED_COMMIT 在 main 的历史里(compare=$status)✓" ;;
            *)
              echo "FAIL: 清单里的提交不在 main 的历史里(compare status=$status)"
              exit 1 ;;
          esac
        fi
    # 钉在被测的那个提交上:构件与源码必须同代,拿别的提交比没有意义。
    # 完整历史是必需的 —— 浅克隆拿不到那个提交,用例里也有翻 git 历史的。
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.source.outputs.commit }}
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install --break-system-packages --no-cache-dir --prefer-binary -r requirements-ci.txt 2>&1 | tee /tmp/pip-all.log || true
    - name: 把发布出去的那一个 wheel 装进干净环境
      shell: bash
      env:
        PUBLISHED_VERSION: ${{ steps.source.outputs.published_version }}
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist"
        # 索引与清单是发布时同一个提交写下的,两者必然一致。
        # 索引从线上读:这一档挂在发布之后跑,checkout 里的那份可能还没
        # 跟上发布 —— 拿旧的索引去下载,测的就不是刚发布的那一个构件。
        index=$(curl -sS --max-time 60 --retry 3 \
          https://raw.githubusercontent.com/bin1732/forgemind-pypi/main/pypi/simple/forgemind/index.html)
        url=$(printf '%s' "$index" | python3 -c "import re,sys;t=sys.stdin.read();print(re.search(r'href=\"([^\"]+)\"',t).group(1))")
        sha=$(printf '%s' "$index" | python3 -c "import re,sys;t=sys.stdin.read();print(re.search(r'sha256=([0-9a-f]{64})',t).group(1))")
        # 存成原名:pip 认的是规范文件名(名称-版本-解释器-abi-平台),
        # 随手改个名会被判成 Invalid wheel filename。
        # 索引里的链接带 #sha256= 片段,先剥掉再取文件名。
        url=${url%%#*}
        name=$(basename "$url")
        echo "下载 $url"
        curl -sSL --retry 5 --retry-delay 5 -o "$GITHUB_WORKSPACE/dist/$name" "$url"
        echo "$sha  $GITHUB_WORKSPACE/dist/$name" | sha256sum -c -
        # 核对 wheel 里的模块与源码一个不少:构建配置漏掉一个子包,
        # 用户装上之后 import 才报错 —— 源码树里那个模块明明在。
        python scripts/check_wheel_contents.py "$GITHUB_WORKSPACE/dist/$name" .
        python -m venv "$GITHUB_WORKSPACE/v"
        "$GITHUB_WORKSPACE/v/bin/pip" install -q --upgrade pip
        # 连依赖一起装,跟真实用户一样
        "$GITHUB_WORKSPACE/v/bin/pip" install -q "$GITHUB_WORKSPACE/dist/$name"
        "$GITHUB_WORKSPACE/v/bin/pip" install -q pytest pytest-asyncio pytest-timeout
        # 发布出去的那个 wheel 报的版本,必须与清单里记的发布版本一致。
        # 清单写的是"这次发布用的版本号"(基础版本 + post 号),而 wheel
        # 的文件名里也是它 —— 两者对不上,说明发布出去的与清单说的不是
        # 同一份东西。
        actual=$(cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/v/bin/python" -c "import forgemind; print(forgemind.__version__)")
        echo "published=$PUBLISHED_VERSION actual=$actual"
        if [ -z "$PUBLISHED_VERSION" ]; then
          echo "FAIL: 清单里没有 published_version —— 这次发布不是用新流程发的"; exit 1
        fi
        [ "$PUBLISHED_VERSION" = "$actual" ] || {
          echo "FAIL: 发布出去的 wheel 版本($actual)与清单记的($PUBLISHED_VERSION)不一致"; exit 1; }
    - name: 全量测试跑在这个环境上
      env:
        # 这一档要验的是用户装到手上的那一份。置 1 之后,测试不再把
        # 源码树顶到导入路径前面 —— 那样测的还是源码,这一档就白跑了。
        # tests/test_under_test_target.py 会核对 import 命中的是不是
        # site-packages 里的发行包,对不上直接报错。
        FORGEMIND_TEST_INSTALLED_PACKAGE: '1'
      run: |
        # PYTHONSAFEPATH:不让 `python -m` 把当前目录塞进 sys.path。
        # 塞进去的话 import forgemind 命中的是源码树,不是装出来的轮子 ——
        # 那测的就还是源码,这一档白跑。
        PYTHONSAFEPATH=1 "$GITHUB_WORKSPACE/v/bin/python" -m pytest tests/ \
          -k "not Benchmark and not test_phase11_mega" \
          -m "not heavy" --tb=short -q --timeout=300
